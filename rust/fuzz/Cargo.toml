[package]
name = "cic-primitive-forms-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cic-primitive-forms]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expand"
path = "fuzz_targets/expand.rs"
test = false
doc = false
bench = false

[[bin]]
name = "defaults"
path = "fuzz_targets/defaults.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve"
path = "fuzz_targets/resolve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "access"
path = "fuzz_targets/access.rs"
test = false
doc = false
bench = false

# Not part of the product crate's build: cargo-fuzz needs its own package and workspace root.
[workspace]

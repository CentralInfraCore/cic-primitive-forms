name: nightly
# The nightly FULL on main (docs/DELTA-DIFF-GATE.md, section 4): the whole gate (p1 and corpus, every mutant, both languages) on the
# head of main, every night, only if the head of main is not the commit the last nightly FULL measured (#94: tools/nightly_last_full.py;
# a 48-hour window ran the FULL twice for one commit, and the comparison does not depend on when a scheduled run starts). If it fails,
# is cancelled, or cannot even decide, a pull request is opened that carries the identifier of the failed run (ci-incidents/<date>-<run
# id>.md and the description), or an issue with the same facts.
#
# 02:00 Europe/Budapest. GitHub cron is UTC only: 01:00 UTC is 02:00 in winter time (CET); in summer time (CEST) it is 03:00 and the
# cron wants "0 0 * * *". GitHub may start a scheduled run late.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve pull requests" in the repository settings
# (Settings > Actions > General, at the bottom, "Workflow permissions"; and in the organization's settings if the organization forbids it), which only
# the owner can switch. Without it the report job does not fail: it opens an ISSUE with the same facts (the run id, the commit, the failed jobs, the branch
# it pushed) and says in a warning why. An issue needs no such setting. The failed run itself stays visible either way.
#
# Test of the report: run the workflow by hand with report_test = true. It skips the heavy gate and runs only the report job, which then opens the pull
# request (or the issue) marked [TEST]; close it afterwards.
on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: ["main"]
    paths: [".github/workflows/p1.yml"]   # the gate itself changed: a FULL in the background (a pull request that changes it runs the diff mode)
  workflow_dispatch:
    inputs:
      force:
        description: "run the FULL even if the last nightly FULL measured the head of main already"
        type: boolean
        default: false
      report_test:
        description: "only test the report: skip the gate and open the [TEST] pull request (or issue) about a pretended failure"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    permissions:
      contents: read
      actions: read   # the earlier nightly runs, for the commit the last FULL measured
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          REPORT_TEST: ${{ inputs.report_test }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          if [ "$REPORT_TEST" = "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "report test: the gate is skipped"; exit 0; fi
          # the FULL measures main; a run by hand from another branch would measure that branch under main's name
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "::warning::the nightly measures main: start it from main ($GITHUB_REF)"; exit 0; fi
          if [ "$EVENT" = "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "the gate workflow changed on main: the FULL runs"; exit 0; fi
          if [ "$FORCE" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "forced by hand: the FULL runs"; exit 0; fi
          python3 tools/nightly_last_full.py --repo "$REPO" --head "$(git rev-parse HEAD)" --current "$RUN_ID" >> "$GITHUB_OUTPUT"
  p1:
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    uses: ./.github/workflows/p1.yml
    with:
      full: true
    permissions:
      contents: read
  corpus:
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    uses: ./.github/workflows/corpus.yml
    permissions:
      contents: read
  report:
    needs: [changed, p1, corpus]
    # also when the decision itself failed, and when a run was cancelled: silence must not look like a pass (#94)
    if: ${{ always() && (github.event.inputs.report_test == 'true' || needs.changed.result == 'failure' || needs.changed.result == 'cancelled' || (needs.changed.outputs.run == 'true' && (needs.p1.result == 'failure' || needs.p1.result == 'cancelled' || needs.corpus.result == 'failure' || needs.corpus.result == 'cancelled'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Open the pull request (or, if that is not allowed, an issue) about the failed run
        env:
          REPORT_TEST: ${{ github.event.inputs.report_test }}
          KIND: ${{ github.event_name == 'push' && 'FULL after a change of the gate workflow' || (github.event_name == 'schedule' && 'Nightly FULL' || 'FULL (by hand)') }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          CHANGED: ${{ needs.changed.result }}
          P1: ${{ needs.p1.result }}
          CORPUS: ${{ needs.corpus.result }}
        run: |
          set -e
          day=$(date -u +%Y-%m-%d)
          failed=$(gh run view "$RUN_ID" --json jobs -q '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.name) (\(.conclusion))"] | join("\n- ")')
          tag=""
          if [ "$REPORT_TEST" = "true" ]; then tag="[TEST] "; failed="(a test of the report: no job failed)"; fi
          branch="ci-incident/nightly-$day-$RUN_ID"
          mkdir -p ci-incidents
          {
            echo "# ${tag}${KIND} failed on $day"
            echo
            echo "- run: $RUN_ID ($RUN_URL)"
            echo "- commit: $SHA"
            echo "- decision: $CHANGED, p1: $P1, corpus: $CORPUS"
            echo "- failed jobs:"
            echo "- $failed"
          } > "ci-incidents/$day-$RUN_ID.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ci-incidents
          git commit -m "ci: record the failed FULL $RUN_ID of $day ($KIND)"
          git push origin "$branch"
          gh label create ci-nightly-failure --color B60205 --description "the nightly FULL on main failed" 2>/dev/null || true
          {
            echo "${tag}${KIND} on main failed."
            echo
            echo "- failed run: **$RUN_ID** - $RUN_URL"
            echo "- commit: \`$SHA\`"
            echo "- decision: $CHANGED, p1: $P1, corpus: $CORPUS"
            echo "- failed jobs:"
            echo "- $failed"
            echo
            echo "This pull request only records the incident (\`ci-incidents/$day-$RUN_ID.md\`). The fix is a separate change; close this one when it is understood."
          } > "$RUNNER_TEMP/body.md"
          title="${tag}ci: ${KIND} failed ($day, run $RUN_ID)"
          if gh pr create --base main --head "$branch" --draft --label ci-nightly-failure --title "$title" --body-file "$RUNNER_TEMP/body.md"; then
            echo "pull request opened"
          else
            echo "::warning::the pull request could not be opened (the repository setting 'Allow GitHub Actions to create and approve pull requests' is probably off, or the organization forbids it); opening an issue with the same facts"
            {
              cat "$RUNNER_TEMP/body.md"
              echo
              echo "(No pull request could be opened; this issue is the record.)"
            } > "$RUNNER_TEMP/issue.md"
            gh issue create --label ci-nightly-failure --title "$title" --body-file "$RUNNER_TEMP/issue.md"
            # the branch was pushed for the pull request; with an issue instead it would only pile up (#94)
            git push origin --delete "$branch" || echo "::warning::the branch $branch could not be deleted"
          fi

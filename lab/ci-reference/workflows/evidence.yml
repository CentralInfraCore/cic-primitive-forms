name: evidence
# The mandatory FULL run of main and its record (docs/EVIDENCE-PUBLISHING.md, step B2 of docs/FULL-DELTA-PLAN.md).
#
# It does not measure anything itself. It finds the runs of p1 and corpus for a commit of main (or asks for them), waits for
# them, builds the record from what they left (tools/test-evidence/build.py), attests it with the identity of THIS workflow
# (the signer the verifier expects: .github/workflows/evidence.yml on refs/heads/main), publishes it to the ci-evidence branch
# with the token of the evidence App, and reads the branch back as a verifier would.
#
# Off until the owner turns it on: the repository variable EVIDENCE_ENABLED has to be 'true' (docs/EVIDENCE-SETUP.md).
on:
  schedule:
    - cron: "17 3 * * *"   # the daily FULL, before the slot of the day is due (06:00 UTC)
    - cron: "47 7 * * *"   # the watchdog: the slot was due at 06:00; if it has no record, the run is asked for
  workflow_dispatch:
    inputs:
      slot:
        description: "UTC day (YYYY-MM-DD) this run stands in for; the watchdog sets it"
        required: false
        type: string
  push:
    branches: [main]
permissions: {}
concurrency:
  group: evidence-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.sha }}-${{ inputs.slot }}
  cancel-in-progress: false
jobs:
  record:
    if: ${{ vars.EVIDENCE_ENABLED == 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 3 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The credentials of the App are secrets of this environment, which only refs/heads/main may use (docs/EVIDENCE-SETUP.md).
    environment: evidence
    permissions:
      contents: read       # the checkout
      actions: write       # to ask p1 and corpus for a run of the daily commit, and to read their jobs and artifacts
      id-token: write      # the attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0   # the verifier asks git about old commits
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Collect the FULL runs of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name == 'push' && 'push' || 'dispatch' }}
        run: python3 tools/test-evidence/evidence.py collect --sha "$GITHUB_SHA" --trigger "$TRIGGER" --out "$RUNNER_TEMP/collected"
      - name: Build the record
        env:
          EVENT: ${{ github.event_name }}
          SLOT: ${{ inputs.slot }}
        run: |
          python3 tools/test-evidence/evidence.py build --collected "$RUNNER_TEMP/collected" --root "$GITHUB_WORKSPACE" \
            --event "$EVENT" --slot "$SLOT" --out "$RUNNER_TEMP/record"
          echo "path=$(ls "$RUNNER_TEMP"/record/*.json)" >> "$GITHUB_OUTPUT"
        id: rec
      # The attestation binds the digest of the record to this workflow (repository, path, ref, commit). It is what a reader
      # trusts; the write access to the branch is defence in depth.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.rec.outputs.path }}
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.EVIDENCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EVIDENCE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish to ci-evidence
        env:
          EVIDENCE_TOKEN: ${{ steps.app.outputs.token }}
          RECORD: ${{ steps.rec.outputs.path }}
        run: python3 tools/test-evidence/evidence.py publish --record "$RECORD" --origin "https://github.com/$GITHUB_REPOSITORY.git"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ci-evidence
          path: evidence-branch
          persist-credentials: false
      - name: Read the branch back as a verifier would
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD: ${{ steps.rec.outputs.path }}
        run: python3 tools/test-evidence/evidence.py verify-published --evidence evidence-branch --root "$GITHUB_WORKSPACE" --record "$(basename "$RECORD")"

  watch:
    if: ${{ vars.EVIDENCE_ENABLED == 'true' && github.event_name == 'schedule' && github.event.schedule == '47 7 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # to dispatch this workflow for the slot that has no record
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The slot of the day has a record, or the run is asked for
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY.git" ci-evidence >/dev/null; then
            git clone -q --depth 1 --branch ci-evidence "https://github.com/$GITHUB_REPOSITORY.git" evidence-branch || exit 1
          else
            mkdir evidence-branch   # no branch yet: no record
          fi
          out=$(python3 tools/test-evidence/evidence.py watch --evidence evidence-branch --root "$GITHUB_WORKSPACE")
          rc=$?
          echo "$out"
          if [ $rc -eq 3 ]; then
            # only "the slot has no record" asks for a run; any other failure (exit 4 and the rest) fails this job and asks for nothing
            slot=$(echo "$out" | sed -n 's/^slot \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\): has no record$/\1/p')
            [ -n "$slot" ] || { echo "::error::exit 3 without a slot line: not asking for a run"; exit 1; }
            echo "::warning::the slot $slot has no record: asking for the run"
            gh workflow run evidence.yml --ref main -f slot="$slot"
          elif [ $rc -ne 0 ]; then
            echo "::error::the watchdog could not decide (exit $rc): look at the branch ci-evidence"
            exit $rc
          fi

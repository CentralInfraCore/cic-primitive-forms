# Provisional logical path cases for ADR 0006. Format: ADR 0005 plus its path amendment.
# Texts are canonical or deliberately not; every positive path_parse case is also a path_format case
# (format of the parsed segments gives the same text). Codes are provisional (codes.yaml).
# trees: synthetic schema fixtures for the path kinds; a notation, not a schema. A list key is the
# resolved identity of ADR 0002 (role: key / item_key; per case for item_choice).
corpus_format: 2
suite: paths
status: provisional
defaults: {adr: ADR-0006, grammar: cic-primitives-73ae469-71ee71ca}
trees:
  main: {'a[0]': {scalar: string}, enabled: {scalar: boolean}, interface.name: {scalar: string}, ip: {composite: {addresses: {set: string}, blob: opaque, gateway: {scalar: string}}}, logical_interfaces: {list: {fields: {ip: {composite: {addresses: {set: string}}}, name: {scalar: string}}, key: [name]}}, mtu: {scalar: integer}, nics: {list: {fields: {name: {scalar: string}, subnet: {scalar: string}, zone: {scalar: string}}, key: [name, zone]}}, nëtz: {scalar: string}, value: {scalar: string}, vlans: {list: {choice: [{fields: {ref: {scalar: string}}, key: [ref], name: referenced}, {fields: {vlan_id: {scalar: integer}, vlan_mode: {scalar: string}}, key: [vlan_id], name: inline}]}}, weird\name: {scalar: string}}
  boolkey: {flags: {list: {fields: {note: {scalar: string}, 'on': {scalar: boolean}}, key: ['on']}}}
  overlap: {items: {list: {choice: [{fields: {k1: {scalar: string}, k2: {scalar: string}, x: {scalar: string}}, key: [k1], name: a}, {fields: {k1: {scalar: string}, k2: {scalar: string}, x: {scalar: string}}, key: [k2], name: b}]}}}
  accessnames: {access: {scalar: string}, ip: {composite: {gateway: {scalar: string}}}}
cases:
  - id: paths.parse-root
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $
    expect: {segments: []}
  - id: paths.parse-simple-field
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.enabled
    expect: {segments: [{field: enabled}]}
  - id: paths.parse-nested-fields
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.ip.addresses
    expect: {segments: [{field: ip}, {field: addresses}]}
  - id: paths.parse-literal-dot-in-name
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.interface\.name
    expect: {segments: [{field: interface.name}]}
  - id: paths.parse-backslash-in-name
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.weird\\name
    expect: {segments: [{field: weird\name}]}
  - id: paths.parse-brackets-in-name
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.a\[0\]
    expect: {segments: [{field: 'a[0]'}]}
  - id: paths.parse-selector-punctuation-in-name
    kind: path_parse
    polarity: positive
    description: 'every escaped character of the set: backslash . [ ] { } = ,'
    schema: {synthetic: {lexical: true}}
    path: $.a\{b\}\=\,
    expect: {segments: [{field: 'a{b}=,'}]}
  - id: paths.parse-non-ascii-name
    kind: path_parse
    polarity: positive
    description: no Unicode normalization, the scalar sequence is kept as written
    schema: {synthetic: {lexical: true}}
    path: $.nëtz
    expect: {segments: [{field: nëtz}]}
  - id: paths.parse-field-named-value
    kind: path_parse
    polarity: positive
    description: a field called value is a field, not Access metadata
    schema: {synthetic: {lexical: true}}
    path: $.value
    expect: {segments: [{field: value}]}
  - id: paths.parse-integer-key-item
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=100}].vlan_mode
    expect: {segments: [{field: vlans}, {item: [{key: {type: integer, value: 100}, name: vlan_id}]}, {field: vlan_mode}]}
  - id: paths.parse-string-key-item
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="eth0.100"}].ip.addresses
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: eth0.100}, name: name}]}, {field: ip}, {field: addresses}]}
  - id: paths.parse-composite-key-item
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.nics[{name="nic-0",zone="eu"}].subnet
    expect: {segments: [{field: nics}, {item: [{key: {type: string, value: nic-0}, name: name}, {key: {type: string, value: eu}, name: zone}]}, {field: subnet}]}
  - id: paths.parse-item-is-a-valid-path-end
    kind: path_parse
    polarity: positive
    description: the item record is addressable as a structural location
    schema: {synthetic: {lexical: true}}
    path: $.nics[{name="nic-0",zone="eu"}]
    expect: {segments: [{field: nics}, {item: [{key: {type: string, value: nic-0}, name: name}, {key: {type: string, value: eu}, name: zone}]}]}
  - id: paths.parse-key-with-delimiters
    kind: path_parse
    polarity: positive
    description: quote, comma, equals, brace, bracket and backslash inside a quoted key value
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="a\"b,c=d}]\\"}]
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: 'a"b,c=d}]\'}, name: name}]}]}
  - id: paths.parse-key-with-control-char
    kind: path_parse
    polarity: positive
    description: short escapes where JSON has them, lowercase \u00xx for the other control characters
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="a\nb\u001f"}]
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: "a\nb\x1F"}, name: name}]}]}
  - id: paths.parse-key-non-ascii-literal
    kind: path_parse
    polarity: positive
    description: non-ASCII is written literally, never escaped
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="é"}]
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: é}, name: name}]}]}
  - id: paths.parse-key-empty-string
    kind: path_parse
    polarity: positive
    description: an empty string is a legal key value; only an empty field name is rejected
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name=""}]
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: ''}, name: name}]}]}
  - id: paths.parse-integer-key-negative
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=-5}]
    expect: {segments: [{field: vlans}, {item: [{key: {type: integer, value: -5}, name: vlan_id}]}]}
  - id: paths.parse-integer-key-zero
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=0}]
    expect: {segments: [{field: vlans}, {item: [{key: {type: integer, value: 0}, name: vlan_id}]}]}
  - id: paths.parse-integer-key-int64-max
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=9223372036854775807}]
    expect: {segments: [{field: vlans}, {item: [{key: {type: integer, value: 9223372036854775807}, name: vlan_id}]}]}
  - id: paths.parse-integer-key-int64-min
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=-9223372036854775808}]
    expect: {segments: [{field: vlans}, {item: [{key: {type: integer, value: -9223372036854775808}, name: vlan_id}]}]}
  - id: paths.parse-item-choice-referenced-selector
    kind: path_parse
    polarity: positive
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{ref="cic:network:vlan-100"}]
    expect: {segments: [{field: vlans}, {item: [{key: {type: string, value: 'cic:network:vlan-100'}, name: ref}]}]}
  - id: paths.parse-string-looking-like-integer
    kind: path_parse
    polarity: positive
    description: quoted is a string, bare is an integer; the schema checks which one the key needs
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="100"}]
    expect: {segments: [{field: logical_interfaces}, {item: [{key: {type: string, value: '100'}, name: name}]}]}
  - id: paths.parse-no-root
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: .enabled
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 0, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-no-root-bare-name
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: enabled
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 0, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-empty-text
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: ''
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 0, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-empty-name-trailing-dot
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.a.
    expect: {errors: [{code: PATH_EMPTY_NAME, path_offset: 4, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-empty-name-double-dot
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.a..b
    expect: {errors: [{code: PATH_EMPTY_NAME, path_offset: 4, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-empty-name-after-root
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.
    expect: {errors: [{code: PATH_EMPTY_NAME, path_offset: 2, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-unknown-escape
    kind: path_parse
    polarity: negative
    description: unknown escape sequences are errors
    schema: {synthetic: {lexical: true}}
    path: $.a\x
    expect: {errors: [{code: PATH_BAD_ESCAPE, path_offset: 3, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-trailing-backslash
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.a\
    expect: {errors: [{code: PATH_BAD_ESCAPE, path_offset: 3, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-unescaped-bracket-in-name
    kind: path_parse
    polarity: negative
    description: the name characters that need escaping are never taken literally
    schema: {synthetic: {lexical: true}}
    path: $.a]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 3, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-unescaped-brace-in-name
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.a{b
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 3, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-control-char-in-name
    kind: path_parse
    polarity: negative
    description: a control character cannot be part of a name
    schema: {synthetic: {lexical: true}}
    path: "$.a\x01b"
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 3, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-index-selector
    kind: path_parse
    polarity: negative
    description: an index never substitutes for a declared key
    schema: {synthetic: {lexical: true}}
    path: $.vlans[0]
    expect: {errors: [{code: PATH_INDEX_SELECTOR, path_offset: 7, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-negative-index-selector
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[-1]
    expect: {errors: [{code: PATH_INDEX_SELECTOR, path_offset: 7, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-without-braces
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[vlan_id=100]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 8, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-empty
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 9, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-empty-name
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{=100}]
    expect: {errors: [{code: PATH_EMPTY_NAME, path_offset: 9, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-unclosed-bracket
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=100}
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 21, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-unclosed-brace
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=100]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 20, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-unquoted-string
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name=eth0}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 27, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-unterminated-string
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="eth0}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 34, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-space-after-bracket
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[ {vlan_id=100}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 8, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-space-after-equals
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id= 100}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-adjacent-items
    kind: path_parse
    polarity: negative
    description: a list element is a record, not a list
    schema: {synthetic: {lexical: true}}
    path: $.nics[{name="a",zone="b"}][{name="a",zone="b"}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 27, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-before-any-field
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $[{vlan_id=1}]
    expect: {errors: [{code: PATH_SYNTAX, path_offset: 1, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-duplicate-component
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.nics[{name="a",name="b"}]
    expect: {errors: [{code: PATH_DUPLICATE_COMPONENT, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-bad-string-escape
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="a\xb"}]
    expect: {errors: [{code: PATH_BAD_ESCAPE, path_offset: 29, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-integer-leading-zero
    kind: path_parse
    polarity: negative
    description: a valid reading exists but it is not the canonical text
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=007}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-integer-plus-sign
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=+7}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-integer-negative-zero
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=-0}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-integer-out-of-range
    kind: path_parse
    polarity: negative
    description: keys outside signed 64-bit are rejected until a numeric contract exists
    schema: {synthetic: {lexical: true}}
    path: $.vlans[{vlan_id=9223372036854775808}]
    expect: {errors: [{code: PATH_INTEGER_RANGE, path_offset: 17, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: provisional
  - id: paths.parse-selector-unicode-escape-of-printable
    kind: path_parse
    polarity: negative
    description: \u is canonical only for control characters without a short escape
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="\u0041"}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 28, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-uppercase-hex-escape
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="\u001F"}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 28, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-long-escape-of-newline
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="\u000a"}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 28, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.parse-selector-escaped-slash
    kind: path_parse
    polarity: negative
    schema: {synthetic: {lexical: true}}
    path: $.logical_interfaces[{name="a\/b"}]
    expect: {errors: [{code: PATH_NONCANONICAL, path_offset: 29, phase: path_parse, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.format-root
    kind: path_format
    polarity: positive
    schema: {synthetic: {lexical: true}}
    segments: []
    expect: {text: $}
  - id: paths.format-escapes-name
    kind: path_format
    polarity: positive
    schema: {synthetic: {lexical: true}}
    segments: [{field: a.b}, {field: c\d}]
    expect: {text: $.a\.b.c\\d}
  - id: paths.format-escapes-selector-name
    kind: path_format
    polarity: positive
    schema: {synthetic: {lexical: true}}
    segments: [{field: l}, {item: [{key: {type: string, value: x}, name: k=1}]}]
    expect: {text: '$.l[{k\=1="x"}]'}
  - id: paths.format-canonical-string
    kind: path_format
    polarity: positive
    schema: {synthetic: {lexical: true}}
    segments: [{field: l}, {item: [{key: {type: string, value: "q\"\\\n"}, name: name}]}]
    expect: {text: '$.l[{name="q\"\\\n"}]'}
  - id: paths.format-composite-order-as-given
    kind: path_format
    polarity: positive
    description: the formatter keeps the segment order it is given; the schema fixes that order
    schema: {synthetic: {lexical: true}}
    segments: [{field: nics}, {item: [{key: {type: string, value: nic-0}, name: name}, {key: {type: string, value: eu}, name: zone}]}]
    expect: {text: '$.nics[{name="nic-0",zone="eu"}]'}
  - id: paths.format-empty-field-name
    kind: path_format
    polarity: negative
    schema: {synthetic: {lexical: true}}
    segments: [{field: ''}]
    expect: {errors: [{code: PATH_EMPTY_NAME, phase: path_format, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.format-control-char-in-name
    kind: path_format
    polarity: negative
    description: a name that cannot be written as canonical text is an error, not an approximation
    schema: {synthetic: {lexical: true}}
    segments: [{field: "a\nb"}]
    expect: {errors: [{code: PATH_SYNTAX, phase: path_format, source_location: {state: not_applicable}}]}
    codes_status: stable
  - id: paths.format-boolean-key
    kind: path_format
    polarity: negative
    description: boolean, number and bytes key encodings are not defined (ADR 0006)
    schema: {synthetic: {lexical: true}}
    segments: [{field: flags}, {item: [{key: {type: boolean, value: true}, name: 'on'}]}]
    expect: {errors: [{code: PATH_KEY_UNSUPPORTED, phase: path_format, source_location: {state: not_applicable}}]}
    codes_status: provisional
  - id: paths.format-integer-key-out-of-range
    kind: path_format
    polarity: negative
    schema: {synthetic: {lexical: true}}
    segments: [{field: vlans}, {item: [{key: {type: integer, value: 9223372036854775808}, name: vlan_id}]}]
    expect: {errors: [{code: PATH_INTEGER_RANGE, phase: path_format, source_location: {state: not_applicable}}]}
    codes_status: provisional
  - id: paths.resolve-root
    kind: path_resolve
    polarity: positive
    schema: {synthetic: {tree: main}}
    path: $
    expect: {primitive_position: false, target: root}
  - id: paths.resolve-scalar
    kind: path_resolve
    polarity: positive
    schema: {synthetic: {tree: main}}
    path: $.mtu
    expect: {primitive_position: true, target: scalar}
  - id: paths.resolve-field-named-value
    kind: path_resolve
    polarity: positive
    schema: {synthetic: {tree: main}}
    path: $.value
    expect: {primitive_position: true, target: scalar}
  - id: paths.resolve-composite
    kind: path_resolve
    polarity: positive
    schema: {synthetic: {tree: main}}
    path: $.ip
    expect: {primitive_position: true, target: composite}
  - id: paths.resolve-nested-scalar
    kind: path_resolve
    polarity: positive
    schema: {synthetic: {tree: main}}
    path: $.ip.gateway
    expect: {primitive_position: true, target: scalar}
  - id: paths.resolve-set-field
    kind: path_resolve
    polarity: positive

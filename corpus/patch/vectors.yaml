# Patch cases (ADR 0013, P4-1). Written by hand from the rules of ADR 0013 and docs/P4-DIFF-PATCH.md; the tool tools/patch-vectors/author.py only does the byte
# arithmetic and tools/corpus_check.py re-checks it (PATCH_BYTES, PATCH_ROUNDTRIP, the diff rules of ADR 0008). Neither Rust nor Go runs these cases yet: the kind is
# NOT RUN until step P4-2. Do not edit this file by hand: change the tool and run it.
# A success holds the output bytes, `replaced` (the paths, in the canonical order of ADR 0008) and `spans` (the byte span of each replaced scalar before and after,
# half-open, a leading BOM counted). A failure holds one error and no text. `diff` is the diff of ADR 0008: the structured events and their canonical bytes (a diff of
# another version is given as its bytes alone). `context` is the context the caller passes (the schema tree the diff is said to have been made under); it is the schema
# of the case when absent. `round_trip` names a B (and optionally a scope) for the property of ADR 0013, section 4, which the patch itself cannot check.
# Conventions: every field of the trees is optional and non-nullable; `routes` is a list whose element identity is the key `to`; `note` is opaque; `tags` is a set.
corpus_format: 2
suite: patch
status: provisional
defaults: {adr: ADR-0013, grammar: cic-primitives-73ae469-6a188078}
trees:
  doc: {name: {scalar: string}, count: {scalar: integer}, enabled: {scalar: boolean}, ip: {composite: {gateway: {scalar: string}, prefix: {scalar: integer}}}, routes: {list: {key: [to], fields: {to: {scalar: string}, metric: {scalar: integer}}}}, tags: {set: string}, note: opaque}
  other: {name: {scalar: integer}}
cases:
  - id: patch.apply-a-string
    kind: patch
    polarity: positive
    description: "one string scalar is replaced, nothing else moves"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: beta\ncount: 3\nenabled: true\n", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 6, "end": 11}, "after": {"start": 6, "end": 10}}]}
  - id: patch.apply-an-integer
    kind: patch
    polarity: positive
    description: "one integer scalar"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 4}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":4,\"path\":\"$.count\",\"previous\":3}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: 4\nenabled: true\n", replaced: ["$.count"], spans: [{"path": "$.count", "before": {"start": 19, "end": 20}, "after": {"start": 19, "end": 20}}]}
  - id: patch.apply-a-boolean
    kind: patch
    polarity: positive
    description: "one boolean scalar"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.enabled", "previous": {"type": "boolean", "value": true}, "next": {"type": "boolean", "value": false}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":false,\"path\":\"$.enabled\",\"previous\":true}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: 3\nenabled: false\n", replaced: ["$.enabled"], spans: [{"path": "$.enabled", "before": {"start": 30, "end": 34}, "after": {"start": 30, "end": 35}}]}
  - id: patch.apply-a-negative-integer
    kind: patch
    polarity: positive
    description: "the new value is written in the canonical decimal spelling"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": -5}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":-5,\"path\":\"$.count\",\"previous\":3}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: -5\nenabled: true\n", replaced: ["$.count"], spans: [{"path": "$.count", "before": {"start": 19, "end": 20}, "after": {"start": 19, "end": 21}}]}
  - id: patch.apply-a-nested-field
    kind: patch
    polarity: positive
    description: "a scalar below a composite"
    schema: {synthetic: {tree: doc}}
    input_yaml: "ip:\n  gateway: g1\n  prefix: 24\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.ip.gateway", "previous": {"type": "string", "value": "g1"}, "next": {"type": "string", "value": "g2"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"g2\",\"path\":\"$.ip.gateway\",\"previous\":\"g1\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "ip:\n  gateway: g2\n  prefix: 24\n", replaced: ["$.ip.gateway"], spans: [{"path": "$.ip.gateway", "before": {"start": 15, "end": 17}, "after": {"start": 15, "end": 17}}]}
  - id: patch.apply-a-list-element-by-identity
    kind: patch
    polarity: positive
    description: "an element of a list is found by its identity, not by its index"
    schema: {synthetic: {tree: doc}}
    input_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 2\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.routes[{to=\"b\"}].metric", "previous": {"type": "integer", "value": 2}, "next": {"type": "integer", "value": 9}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":9,\"path\":\"$.routes[{to=\\\"b\\\"}].metric\",\"previous\":2}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 9\n", replaced: ["$.routes[{to=\"b\"}].metric"], spans: [{"path": "$.routes[{to=\"b\"}].metric", "before": {"start": 54, "end": 55}, "after": {"start": 54, "end": 55}}]}
  - id: patch.apply-a-list-element-after-reorder
    kind: patch
    polarity: positive
    description: "the order of the list in the document is not the order of the diff"
    schema: {synthetic: {tree: doc}}
    input_yaml: "routes:\n  - to: b\n    metric: 2\n  - to: a\n    metric: 1\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.routes[{to=\"b\"}].metric", "previous": {"type": "integer", "value": 2}, "next": {"type": "integer", "value": 9}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":9,\"path\":\"$.routes[{to=\\\"b\\\"}].metric\",\"previous\":2}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "routes:\n  - to: b\n    metric: 9\n  - to: a\n    metric: 1\n", replaced: ["$.routes[{to=\"b\"}].metric"], spans: [{"path": "$.routes[{to=\"b\"}].metric", "before": {"start": 30, "end": 31}, "after": {"start": 30, "end": 31}}]}
  - id: patch.apply-a-value-in-an-expanded-position
    kind: patch
    polarity: positive
    description: "the value of an expanded position is replaced, its other members are not touched"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name:\n  value: alpha\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name:\n  value: beta\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\n", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 15, "end": 20}, "after": {"start": 15, "end": 19}}]}
  - id: patch.apply-three-in-canonical-order
    kind: patch
    polarity: positive
    description: "the events are in path order, the document is not: `replaced` follows the diff"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 4}}, {"kind": "value_change", "path": "$.enabled", "previous": {"type": "boolean", "value": true}, "next": {"type": "boolean", "value": false}}, {"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":4,\"path\":\"$.count\",\"previous\":3},{\"kind\":\"value_change\",\"next\":false,\"path\":\"$.enabled\",\"previous\":true},{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: beta\ncount: 4\nenabled: false\n", replaced: ["$.count", "$.enabled", "$.name"], spans: [{"path": "$.count", "before": {"start": 19, "end": 20}, "after": {"start": 18, "end": 19}}, {"path": "$.enabled", "before": {"start": 30, "end": 34}, "after": {"start": 29, "end": 34}}, {"path": "$.name", "before": {"start": 6, "end": 11}, "after": {"start": 6, "end": 10}}]}
  - id: patch.apply-two-in-one-composite
    kind: patch
    polarity: positive
    description: "two fields of one composite, one longer and one shorter"
    schema: {synthetic: {tree: doc}}
    input_yaml: "ip:\n  gateway: g1\n  prefix: 24\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.ip.gateway", "previous": {"type": "string", "value": "g1"}, "next": {"type": "string", "value": "gateway-2"}}, {"kind": "value_change", "path": "$.ip.prefix", "previous": {"type": "integer", "value": 24}, "next": {"type": "integer", "value": 8}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"gateway-2\",\"path\":\"$.ip.gateway\",\"previous\":\"g1\"},{\"kind\":\"value_change\",\"next\":8,\"path\":\"$.ip.prefix\",\"previous\":24}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "ip:\n  gateway: gateway-2\n  prefix: 8\n", replaced: ["$.ip.gateway", "$.ip.prefix"], spans: [{"path": "$.ip.gateway", "before": {"start": 15, "end": 17}, "after": {"start": 15, "end": 24}}, {"path": "$.ip.prefix", "before": {"start": 28, "end": 30}, "after": {"start": 35, "end": 36}}]}
  - id: patch.apply-two-list-elements
    kind: patch
    polarity: positive
    description: "two elements of one list"
    schema: {synthetic: {tree: doc}}
    input_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 2\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.routes[{to=\"a\"}].metric", "previous": {"type": "integer", "value": 1}, "next": {"type": "integer", "value": 10}}, {"kind": "value_change", "path": "$.routes[{to=\"b\"}].metric", "previous": {"type": "integer", "value": 2}, "next": {"type": "integer", "value": 20}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":10,\"path\":\"$.routes[{to=\\\"a\\\"}].metric\",\"previous\":1},{\"kind\":\"value_change\",\"next\":20,\"path\":\"$.routes[{to=\\\"b\\\"}].metric\",\"previous\":2}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "routes:\n  - to: a\n    metric: 10\n  - to: b\n    metric: 20\n", replaced: ["$.routes[{to=\"a\"}].metric", "$.routes[{to=\"b\"}].metric"], spans: [{"path": "$.routes[{to=\"a\"}].metric", "before": {"start": 30, "end": 31}, "after": {"start": 30, "end": 32}}, {"path": "$.routes[{to=\"b\"}].metric", "before": {"start": 54, "end": 55}, "after": {"start": 55, "end": 57}}]}
  - id: patch.apply-keeps-a-single-quoted-style
    kind: patch
    polarity: positive
    description: "the quotes stay, a quote in the value is doubled"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: 'alpha'\ncount: 3\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "it's"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"it's\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: 'it''s'\ncount: 3\n", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 6, "end": 13}, "after": {"start": 6, "end": 13}}]}
  - id: patch.apply-keeps-a-double-quoted-style
    kind: patch
    polarity: positive
    description: "the quotes stay, a quote and a backslash in the value are escaped"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: \"alpha\"\ncount: 3\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "say \"hi\" \\"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"say \\\"hi\\\" \\\\\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: \"say \\\"hi\\\" \\\\\"\ncount: 3\n", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 6, "end": 13}, "after": {"start": 6, "end": 21}}]}
  - id: patch.apply-keeps-comments
    kind: patch
    polarity: positive
    description: "the comments around the scalars are not touched"
    schema: {synthetic: {tree: doc}}
    input_yaml: "# top\nname: alpha   # the host\n# between\ncount: 3 # n\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 4}}, {"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":4,\"path\":\"$.count\",\"previous\":3},{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "# top\nname: beta   # the host\n# between\ncount: 4 # n\n", replaced: ["$.count", "$.name"], spans: [{"path": "$.count", "before": {"start": 48, "end": 49}, "after": {"start": 47, "end": 48}}, {"path": "$.name", "before": {"start": 12, "end": 17}, "after": {"start": 12, "end": 16}}]}
  - id: patch.apply-keeps-crlf
    kind: patch
    polarity: positive
    description: "CRLF line breaks are not touched"
    schema: {synthetic: {tree: doc}}
    input_hex: "6e616d653a20616c7068610d0a636f756e743a20330d0a"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_hex: "6e616d653a20626574610d0a636f756e743a20330d0a", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 6, "end": 11}, "after": {"start": 6, "end": 10}}]}
  - id: patch.apply-keeps-a-bom
    kind: patch
    polarity: positive
    description: "a leading BOM stays and counts in the offsets"
    schema: {synthetic: {tree: doc}}
    input_hex: "efbbbf6e616d653a20616c7068610a636f756e743a20330a"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 4}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":4,\"path\":\"$.count\",\"previous\":3}],\"representation\":[],\"version\":1}"}
    expect: {output_hex: "efbbbf6e616d653a20616c7068610a636f756e743a20340a", replaced: ["$.count"], spans: [{"path": "$.count", "before": {"start": 22, "end": 23}, "after": {"start": 22, "end": 23}}]}
  - id: patch.apply-keeps-a-missing-final-newline
    kind: patch
    polarity: positive
    description: "a text without a final line break stays without one"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 44}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":44,\"path\":\"$.count\",\"previous\":3}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: 44", replaced: ["$.count"], spans: [{"path": "$.count", "before": {"start": 19, "end": 20}, "after": {"start": 19, "end": 21}}]}
  - id: patch.apply-keeps-non-ascii-text
    kind: patch
    polarity: positive
    description: "the offsets are bytes: the text around and in the value has multi-byte characters"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: tűrő\ncount: 3\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 1000}}, {"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "tűrő"}, "next": {"type": "string", "value": "árvíz"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":1000,\"path\":\"$.count\",\"previous\":3},{\"kind\":\"value_change\",\"next\":\"árvíz\",\"path\":\"$.name\",\"previous\":\"tűrő\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: árvíz\ncount: 1000\n", replaced: ["$.count", "$.name"], spans: [{"path": "$.count", "before": {"start": 20, "end": 21}, "after": {"start": 21, "end": 25}}, {"path": "$.name", "before": {"start": 6, "end": 12}, "after": {"start": 6, "end": 13}}]}
  - id: patch.apply-matches-a-noncanonical-previous
    kind: patch
    polarity: positive
    description: "True is the value true: `previous` is a value, not a spelling"
    schema: {synthetic: {tree: doc}}
    input_yaml: "enabled: True\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.enabled", "previous": {"type": "boolean", "value": true}, "next": {"type": "boolean", "value": false}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":false,\"path\":\"$.enabled\",\"previous\":true}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "enabled: false\n", replaced: ["$.enabled"], spans: [{"path": "$.enabled", "before": {"start": 9, "end": 13}, "after": {"start": 9, "end": 14}}]}
  - id: patch.apply-matches-a-signed-previous
    kind: patch
    polarity: positive
    description: "+5 is the integer 5"
    schema: {synthetic: {tree: doc}}
    input_yaml: "count: +5\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 5}, "next": {"type": "integer", "value": 6}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":6,\"path\":\"$.count\",\"previous\":5}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "count: 6\n", replaced: ["$.count"], spans: [{"path": "$.count", "before": {"start": 7, "end": 9}, "after": {"start": 7, "end": 8}}]}
  - id: patch.an-empty-diff-is-the-identity
    kind: patch
    polarity: positive
    description: "no change: the text is returned as it was, and nothing was replaced"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [], "representation": [], "canonical": "{\"changes\":[],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: 3\nenabled: true\n", replaced: [], spans: []}
  - id: patch.representation-entries-are-not-applied
    kind: patch
    polarity: positive
    description: "a representation difference is evidence of writing, never a change: the text is returned as it was"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [], "representation": [{"kind": "representation_change", "path": "$.name", "previous": "short", "next": "expanded"}], "canonical": "{\"changes\":[],\"representation\":[{\"kind\":\"representation_change\",\"next\":\"expanded\",\"path\":\"$.name\",\"previous\":\"short\"}],\"version\":1}"}
    expect: {output_yaml: "name: alpha\ncount: 3\nenabled: true\n", replaced: [], spans: []}
  - id: patch.representation-next-to-a-value-change
    kind: patch
    polarity: positive
    description: "the value change is applied, the representation entry is ignored (the position stays short)"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    diff: {"changes": [{"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [{"kind": "representation_change", "path": "$.name", "previous": "short", "next": "expanded"}], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[{\"kind\":\"representation_change\",\"next\":\"expanded\",\"path\":\"$.name\",\"previous\":\"short\"}],\"version\":1}"}
    expect: {output_yaml: "name: beta\ncount: 3\nenabled: true\n", replaced: ["$.name"], spans: [{"path": "$.name", "before": {"start": 6, "end": 11}, "after": {"start": 6, "end": 10}}]}
  - id: patch.round-trip-full-scope
    kind: patch
    polarity: positive
    description: "the diff against B is empty after the patch: B is written with other quotes and a comment, the logical content is the same"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    round_trip: {"b_yaml": "name: 'beta'   # the host\ncount: 4\nenabled: true\n"}
    diff: {"changes": [{"kind": "value_change", "path": "$.count", "previous": {"type": "integer", "value": 3}, "next": {"type": "integer", "value": 4}}, {"kind": "value_change", "path": "$.name", "previous": {"type": "string", "value": "alpha"}, "next": {"type": "string", "value": "beta"}}], "representation": [], "canonical": "{\"changes\":[{\"kind\":\"value_change\",\"next\":4,\"path\":\"$.count\",\"previous\":3},{\"kind\":\"value_change\",\"next\":\"beta\",\"path\":\"$.name\",\"previous\":\"alpha\"}],\"representation\":[],\"version\":1}"}
    expect: {output_yaml: "name: beta\ncount: 4\nenabled: true\n", replaced: ["$.count", "$.name"], spans: [{"path": "$.count", "before": {"start": 19, "end": 20}, "after": {"start": 18, "end": 19}}, {"path": "$.name", "before": {"start": 6, "end": 11}, "after": {"start": 6, "end": 10}}]}
  - id: patch.round-trip-short-versus-expanded
    kind: patch
    polarity: positive
    description: "B writes the position expanded: the same logical content"
    schema: {synthetic: {tree: doc}}
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    round_trip: {"b_yaml": "name:\n  value: beta\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\nenabled: true\n"}

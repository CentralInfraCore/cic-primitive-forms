# Provisional recognition vectors for ADR 0001. Format is not final.
# position: scalar | any | {structured: [child fields]} | {list_of: <position>}
# A = [value, access, modify, inherit, default_injection, conformance]
# validate: expected result of the later validate step on a Short node
#           (codes provisional).
vectors:
  - {id: scalar-short, position: scalar, input: 4, expect: {class: short}}
  - {id: list-short, position: any, input: [1, 2], expect: {class: short}}
  - {id: null-short, position: any, input: null, expect: {class: short}}
  - id: full-key-set-expanded
    position: scalar
    input: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    expect: {class: expanded}
  - id: full-key-set-any-is-expanded
    position: any
    input: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    expect: {class: expanded}
  - id: full-key-set-structured-is-expanded
    position: {structured: [host, port]}
    input: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    expect: {class: expanded}
  - id: any-literal-map-wrapped
    description: literal map equal to A is written under an explicit wrapper; its content stays opaque
    position: any
    input:
      value: {value: 1, access: 2, modify: 3, inherit: 4, default_injection: 5, conformance: 6}
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    expect: {class: expanded, opaque_value: true}
  - id: structured-child-fields-equal-A-precedence
    description: schema children equal A; a map with exactly A is still Expanded (Access keys take precedence)
    position: {structured: [value, access, modify, inherit, default_injection, conformance]}
    input: {value: 1, access: 2, modify: 3, inherit: 4, default_injection: 5, conformance: 6}
    expect: {class: expanded}
  - {id: any-plain-map-short, position: any, input: {a: 1, b: 2}, expect: {class: short}}
  - {id: any-one-access-key-plus-foreign, position: any, input: {value: 1, foo: 2}, expect: {class: short}}
  - id: any-one-key-is-data
    description: missing keys mean Short; at any position this is data
    position: any
    input: {value: 1}
    expect: {class: short}
  - id: any-two-keys-is-data
    position: any
    input: {value: 1, access: 2}
    expect: {class: short}
  - id: scalar-partial-is-short-then-rejected
    position: scalar
    input: {value: 1, access: inherit}
    expect: {class: short, validate: {code: MAP_AT_SCALAR_POSITION}}
  - id: structured-partial-is-short-then-rejected
    position: {structured: [host, port]}
    input: {value: 1, access: inherit}
    expect: {class: short, validate: {code: UNKNOWN_FIELD}}
  - id: structured-child-named-like-access-key
    position: {structured: [access, port]}
    input: {access: ops, port: 22}
    expect: {class: short}
  - id: structured-unknown-field-short-then-rejected
    position: {structured: [host, port]}
    input: {host: a, colour: red}
    expect: {class: short, validate: {code: UNKNOWN_FIELD}}
  - id: scalar-plain-map-short-then-rejected
    position: scalar
    input: {a: 1}
    expect: {class: short, validate: {code: MAP_AT_SCALAR_POSITION}}
  - id: all-keys-plus-extra-any
    description: a hostile or mistaken expanded node is never read as data
    position: any
    input: {value: secret, access: [admins], modify: [], inherit: true, default_injection: null, conformance: implemented, audit: true}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
  - id: all-keys-plus-extra-scalar
    position: scalar
    input: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented, extra: 1}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
  - id: all-keys-plus-extra-structured
    position: {structured: [host, port]}
    input: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented, host: a}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
  - id: list-elements-recognized-individually
    description: provisional, depends on the schema contract (issue 3 point 4)
    position: {list_of: {structured: [host]}}
    input:
      - {host: a}
      - {value: 1, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    expect: {classes: [short, expanded]}
  - id: duplicate-key
    description: rejected in the parse phase, before recognition
    position: any
    input_yaml: "a: 1\na: 2\n"
    expect: {phase: parse, code: DUPLICATE_KEY}
# Round trip: expand(collapse(L, I, S), S) == L. Defaults of S:
# access: inherit, modify: inherit, inherit: true, default_injection: null,
# conformance: implemented.
# authored_expanded: whether the intent I wrote this node in expanded form.
roundtrip:
  - id: defaults-collapse-to-short
    position: scalar
    L: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: short}
  - id: explicit-access-override-stays-expanded
    position: scalar
    L: {value: 4, access: [OU=admins], modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: explicit-inherit-false-scalar-stays-expanded
    position: scalar
    L: {value: 4, access: inherit, modify: inherit, inherit: false, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: shortable-map-value-with-policy-stays-expanded
    position: {structured: [foo]}
    L: {value: {foo: bar}, access: [OU=admins], modify: inherit, inherit: false, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: non-default-default-injection-stays-expanded
    position: scalar
    L: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: 0, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: non-default-conformance-stays-expanded
    position: scalar
    L: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: deprecated}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: authored-expanded-defaults-stay-expanded
    position: scalar
    L: {value: 4, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: true
    expect: {collapse: expanded}
  - id: any-value-equal-to-A-stays-expanded
    description: a short form would be recognized as expanded
    position: any
    L: {value: {value: 1, access: 2, modify: 3, inherit: 4, default_injection: 5, conformance: 6}, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: any-value-superset-of-A-stays-expanded
    description: a short form would be rejected as EXPANDED_WITH_EXTRA_KEY
    position: any
    L: {value: {value: 1, access: 2, modify: 3, inherit: 4, default_injection: 5, conformance: 6, x: 7}, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: any-value-proper-subset-collapses
    description: under the simple rule a proper subset is safely Short
    position: any
    L: {value: {value: 1, access: 2}, access: inherit, modify: inherit, inherit: true, default_injection: null, conformance: implemented}
    authored_expanded: false
    expect: {collapse: short}

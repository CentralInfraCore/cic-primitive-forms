# Provisional recognition and collapse cases for ADR 0001. Format: ADR 0005.
# Positions: scalar | opaque | {structured: [fields]} | {list_of: position}.
# A = [value, access, modify, inherit, default_injection, conformance], read from the grammar pin.
# recognize.expect.validate: expected result of the later validate step on a Short node.
# collapse: expand(collapse(L, I, S), S) == L; defaults of S are the symbolic ones;
# authored_expanded says whether the intent wrote the node in expanded form.
corpus_format: 1
suite: recognition
status: provisional
defaults: {adr: ADR-0001, grammar: cic-primitives-devel}
cases:
  - id: recognition.scalar-short
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: 4
    expect: {class: short}
  - id: recognition.list-short
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: [1, 2]
    expect: {class: short}
  - id: recognition.null-short
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: null
    expect: {class: short}
  - id: recognition.full-key-set-expanded
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    expect: {class: expanded}
  - id: recognition.full-key-set-any-is-expanded
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    expect: {class: expanded}
  - id: recognition.full-key-set-structured-is-expanded
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: {structured: [host, port]}}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    expect: {class: expanded}
  - id: recognition.any-literal-map-wrapped
    kind: recognize
    polarity: positive
    description: literal map equal to A is written under an explicit wrapper; its content stays opaque
    schema: {synthetic: {position: opaque}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: {access: 2, conformance: 6, default_injection: 5, inherit: 4, modify: 3, value: 1}}
    expect: {class: expanded, opaque_value: true}
  - id: recognition.structured-child-fields-equal-a-precedence
    kind: recognize
    polarity: positive
    description: schema children equal A; a map with exactly A is still Expanded (Access keys take precedence)
    schema: {synthetic: {position: {structured: [value, access, modify, inherit, default_injection, conformance]}}}
    input: {access: 2, conformance: 6, default_injection: 5, inherit: 4, modify: 3, value: 1}
    expect: {class: expanded}
  - id: recognition.any-plain-map-short
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {a: 1, b: 2}
    expect: {class: short}
  - id: recognition.any-one-access-key-plus-foreign
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {foo: 2, value: 1}
    expect: {class: short}
  - id: recognition.any-one-key-is-data
    kind: recognize
    polarity: positive
    description: missing keys mean Short; at any position this is data
    schema: {synthetic: {position: opaque}}
    input: {value: 1}
    expect: {class: short}
  - id: recognition.any-two-keys-is-data
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {access: 2, value: 1}
    expect: {class: short}
  - id: recognition.scalar-partial-is-short-then-rejected
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, value: 1}
    expect: {class: short, validate: {code: MAP_AT_SCALAR_POSITION}}
    codes_status: provisional
  - id: recognition.structured-partial-is-short-then-rejected
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: {structured: [host, port]}}}
    input: {access: inherit, value: 1}
    expect: {class: short, validate: {code: UNKNOWN_FIELD}}
    codes_status: provisional
  - id: recognition.structured-child-named-like-access-key
    kind: recognize
    polarity: positive
    schema: {synthetic: {position: {structured: [access, port]}}}
    input: {access: ops, port: 22}
    expect: {class: short}
  - id: recognition.structured-unknown-field-short-then-rejected
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: {structured: [host, port]}}}
    input: {colour: red, host: a}
    expect: {class: short, validate: {code: UNKNOWN_FIELD}}
    codes_status: provisional
  - id: recognition.scalar-plain-map-short-then-rejected
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: scalar}}
    input: {a: 1}
    expect: {class: short, validate: {code: MAP_AT_SCALAR_POSITION}}
    codes_status: provisional
  - id: recognition.all-keys-plus-extra-any
    kind: recognize
    polarity: negative
    description: a hostile or mistaken expanded node is never read as data
    schema: {synthetic: {position: opaque}}
    input: {access: [admins], audit: true, conformance: implemented, default_injection: null, inherit: true, modify: [], value: secret}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
    codes_status: provisional
  - id: recognition.all-keys-plus-extra-scalar
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, extra: 1, inherit: true, modify: inherit, value: 4}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
    codes_status: provisional
  - id: recognition.all-keys-plus-extra-structured
    kind: recognize
    polarity: negative
    schema: {synthetic: {position: {structured: [host, port]}}}
    input: {access: inherit, conformance: implemented, default_injection: null, host: a, inherit: true, modify: inherit, value: 4}
    expect: {class: error, code: EXPANDED_WITH_EXTRA_KEY}
    codes_status: provisional
  - id: recognition.list-record-fields-recognized-individually
    kind: recognize
    polarity: positive
    description: a list element is a structural record, not a position (ADR 0002); each field of the record is recognized on its own
    schema: {synthetic: {position: {list_of: {record: {host: scalar, port: scalar}}}}}
    input: [{host: a, port: 22}, {host: b, port: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 22}}]
    expect: {elements: [{host: short, port: short}, {host: short, port: expanded}]}
  - id: recognition.list-record-is-not-recognized-as-a-whole
    kind: recognize
    polarity: positive
    description: a record whose field names equal the Access key set is still a record; only its fields are positions
    schema: {synthetic: {position: {list_of: {record: {value: scalar, access: scalar, modify: scalar, inherit: scalar, default_injection: scalar, conformance: scalar}}}}}
    input: [{access: 2, conformance: 6, default_injection: 5, inherit: 4, modify: 3, value: 1}]
    expect: {elements: [{access: short, conformance: short, default_injection: short, inherit: short, modify: short, value: short}]}
  - id: recognition.duplicate-key
    kind: recognize
    polarity: negative
    description: rejected in the parse phase, before recognition
    schema: {synthetic: {position: opaque}}
    input_yaml: 'a: 1

  a: 2

  '
    expect: {code: DUPLICATE_KEY, phase: parse}
    codes_status: provisional
  - id: recognition.defaults-collapse-to-short
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    authored_expanded: false
    expect: {collapse: short}
  - id: recognition.explicit-access-override-stays-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: [OU=admins], conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.explicit-inherit-false-scalar-stays-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: false, modify: inherit, value: 4}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.shortable-map-value-with-policy-stays-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: {structured: [foo]}}}
    input: {access: [OU=admins], conformance: implemented, default_injection: null, inherit: false, modify: inherit, value: {foo: bar}}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.non-default-default-injection-stays-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: 0, inherit: true, modify: inherit, value: 4}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.non-default-conformance-stays-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: deprecated, default_injection: null, inherit: true, modify: inherit, value: 4}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.authored-expanded-defaults-stay-expanded
    kind: collapse
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 4}
    authored_expanded: true
    expect: {collapse: expanded}
  - id: recognition.any-value-equal-to-a-stays-expanded
    kind: collapse
    polarity: positive
    description: a short form would be recognized as expanded
    schema: {synthetic: {position: opaque}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: {access: 2, conformance: 6, default_injection: 5, inherit: 4, modify: 3, value: 1}}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.any-value-superset-of-a-stays-expanded
    kind: collapse
    polarity: positive
    description: a short form would be rejected as EXPANDED_WITH_EXTRA_KEY
    schema: {synthetic: {position: opaque}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: {access: 2, conformance: 6, default_injection: 5, inherit: 4, modify: 3, value: 1, x: 7}}
    authored_expanded: false
    expect: {collapse: expanded}
  - id: recognition.any-value-proper-subset-collapses
    kind: collapse
    polarity: positive
    description: under the simple rule a proper subset is safely Short
    schema: {synthetic: {position: opaque}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: {access: 2, value: 1}}
    authored_expanded: false
    expect: {collapse: short}

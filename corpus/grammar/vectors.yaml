    declared: bec0cbfadc3be689c56cecdc4a9fb2227844b20cfb326e794df3077c61cecdfb
    expect: {errors: [{code: GRAMMAR_DIGEST_MISMATCH, phase: validate, source_location: {state: not_applicable}}]}
    codes_status: stable

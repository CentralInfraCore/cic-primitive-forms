# Provisional grammar identity cases for ADR 0002. Format: ADR 0005 plus its grammar amendment.
# Kind grammar_manifest: the library is given (path, sha256) entries and a declared manifest digest.
# The digest is the SHA-256 of the sha256sum-format lines sorted by the UTF-8 bytes of the path.
# valid: the digest reproduces. GRAMMAR_DIGEST_MISMATCH: a changed, missing, extra or renamed file,
# or a wrong declaration. The gate recomputes the digest of every case, so a fixture cannot lie.
corpus_format: 2
suite: grammar
status: provisional
defaults: {adr: ADR-0002, grammar: cic-primitives-5a26bd8-76f1d664}
cases:
  - id: grammar.pinned-manifest-reproduces
    kind: grammar_manifest
    polarity: positive
    description: the seven accepted files with the SHA-256 of their raw blob bytes at the pinned commit
    schema: {synthetic: {lexical: true}}
    files: [{path: proposals/atom-grammar/README.md, sha256: 146006b1a20166dd098cf34fefb5609b97d77c5ef3fd4ad5b3bff9a68f1f1629}, {path: proposals/atom-grammar/check_grammar.py, sha256: e6d013d9cfd25918c522b6c0fece74c6f86c5a277ba62a18ab7eb949cd10248b}, {path: proposals/atom-grammar/instance-grammar.schema.yaml, sha256: fdb5e4e5a1916b089b538cc2ee5274c276d7e70570899d98e7feb2bc73118f0b}, {path: schemas/aggregate/policy-surface.yaml, sha256: f80fb77b296038344e26bf2fe695cd5bf9d13aacf296b22283abd18c4a709912}, {path: schemas/atomic/access.yaml, sha256: 09fb8a8e85da140a35904fd1574dab0f794a37a1b52a30a7f2a022aefeb3942d}, {path: schemas/atomic/role.yaml, sha256: 71fc185a0bf78b7ba57b30bdea7fabda370a63b5c73de1cc4444aeea4f679659}, {path: schemas/atomic/shape.yaml, sha256: 3faf92f5dd57aaf384052e86fe2a06ac7cac545c26dbd1359d8c74fdb097bea7}]
    declared: 76f1d664683ec9177bada778735e911a72815923b2304712700e271b602ec5f1
    expect: {valid: true}
  - id: grammar.input-order-does-not-matter
    kind: grammar_manifest
    polarity: positive
    description: the manifest is sorted by the library, not taken in the order given
    schema: {synthetic: {lexical: true}}
    files: [{path: schemas/atomic/shape.yaml, sha256: 3faf92f5dd57aaf384052e86fe2a06ac7cac545c26dbd1359d8c74fdb097bea7}, {path: schemas/atomic/role.yaml, sha256: 71fc185a0bf78b7ba57b30bdea7fabda370a63b5c73de1cc4444aeea4f679659}, {path: schemas/atomic/access.yaml, sha256: 09fb8a8e85da140a35904fd1574dab0f794a37a1b52a30a7f2a022aefeb3942d}, {path: schemas/aggregate/policy-surface.yaml, sha256: f80fb77b296038344e26bf2fe695cd5bf9d13aacf296b22283abd18c4a709912}, {path: proposals/atom-grammar/instance-grammar.schema.yaml, sha256: fdb5e4e5a1916b089b538cc2ee5274c276d7e70570899d98e7feb2bc73118f0b}, {path: proposals/atom-grammar/check_grammar.py, sha256: e6d013d9cfd25918c522b6c0fece74c6f86c5a277ba62a18ab7eb949cd10248b}, {path: proposals/atom-grammar/README.md, sha256: 146006b1a20166dd098cf34fefb5609b97d77c5ef3fd4ad5b3bff9a68f1f1629}]
    declared: 76f1d664683ec9177bada778735e911a72815923b2304712700e271b602ec5f1
    expect: {valid: true}
  - id: grammar.synthetic-set-is-ordered-by-path-bytes
    kind: grammar_manifest
    polarity: positive
    description: 'uppercase before lowercase before the two-byte e-acute: UTF-8 byte order of the path, not locale order'
    schema: {synthetic: {lexical: true}}
    files: [{path: z.yaml, sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}, {path: é.yaml, sha256: '1111111111111111111111111111111111111111111111111111111111111111'}, {path: B.yaml, sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff}]
    declared: ec1bd8574971324b5502a1dcd46fb6e5f36767a747ef539094c239061d9505cf
    expect: {valid: true}
  - id: grammar.digest-of-lines-sorted-as-text-is-wrong
    kind: grammar_manifest
    polarity: negative
    description: ordering the whole lines by their hash prefix is not the contract; the order is by path
    schema: {synthetic: {lexical: true}}

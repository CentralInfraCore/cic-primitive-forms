# Provisional inheritance cases for ADR 0004. Format: ADR 0005.
# Values are YAML-typed: 0 is an integer, "0" a string, false a boolean.
# Cases assert only that input type and value are preserved and that false and 0 stay
# different. They fix no internal enum name (an upstream decision).
# schema.synthetic.slot names the atom slot under test.
corpus_format: 2
suite: inherit
status: provisional
defaults: {adr: ADR-0004, grammar: cic-primitives-73ae469-6a188078}
cases:
  - id: inherit.key-true-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: inherit_key}}
    input: true
    expect: {preserved: {type: boolean, value: true}, valid: true}
  - id: inherit.key-false-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: inherit_key}}
    input: false
    expect: {preserved: {type: boolean, value: false}, valid: true}
  - id: inherit.key-zero-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: inherit_key}}
    input: 0
    expect: {preserved: {type: integer, value: 0}, valid: true}
  - id: inherit.key-one-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_key}}
    input: 1
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.key-string-true-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_key}}
    input: 'true'
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.key-string-zero-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_key}}
    input: '0'
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.key-null-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_key}}
    input: null
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.key-list-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_key}}
    input: []
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.policy-true-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: inherit_policy}}
    input: true
    expect: {preserved: {type: boolean, value: true}, valid: true}
  - id: inherit.policy-false-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: inherit_policy}}
    input: false
    expect: {preserved: {type: boolean, value: false}, valid: true}
  - id: inherit.policy-zero-ok-despite-boolean-declaration
    kind: validate
    polarity: positive
    description: grammar 1 reads 0 as reset at object scope too; D-018 types inherit_policy as InheritanceMode, so the former upstream boolean-against-0 conflict no longer exists (ADR 0004, adoption record). The id is kept because ids are stable.
    schema: {synthetic: {slot: inherit_policy}}
    input: 0
    expect: {preserved: {type: integer, value: 0}, valid: true}
  - id: inherit.policy-one-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_policy}}
    input: 1
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.policy-string-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: inherit_policy}}
    input: 'false'
    expect: {errors: [{code: INVALID_INHERIT, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.access-symbol-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: access_modify}}
    input: inherit
    expect: {kind: symbol, valid: true}
  - id: inherit.access-pattern-list-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: access_modify}}
    input: ['OU=operators,O=acme-corp']
    expect: {kind: list, valid: true}
  - id: inherit.access-wildcard-pattern-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: access_modify}}
    input: ['CN=*,O=partner-a']
    expect: {kind: list, valid: true}
  - id: inherit.access-empty-list-is-nobody-not-inherit
    kind: validate
    polarity: positive
    schema: {synthetic: {slot: access_modify}}
    input: []
    expect: {is_inherit: false, kind: list, valid: true}
  - id: inherit.access-list-holding-symbol-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: access_modify}}
    input: [inherit]
    expect: {errors: [{code: INVALID_CERT_PATTERN, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.access-bare-pattern-scalar-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: access_modify}}
    input: OU=ops,O=acme
    expect: {errors: [{code: INVALID_ACCESS_VALUE, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.access-null-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: access_modify}}
    input: null
    expect: {errors: [{code: INVALID_ACCESS_VALUE, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.access-boolean-rejected
    kind: validate
    polarity: negative
    schema: {synthetic: {slot: access_modify}}
    input: true
    expect: {errors: [{code: INVALID_ACCESS_VALUE, phase: validate, source_location: {state: unavailable}}]}
    codes_status: provisional
  - id: inherit.zero-spelling-preserved
    kind: roundtrip
    polarity: positive
    description: inherit 0 must come back as integer 0, never as false
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: 0, modify: inherit, value: 1}
    expect: {fields: {inherit: {type: integer, value: 0}}}
  - id: inherit.false-spelling-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: false, modify: inherit, value: 1}
    expect: {fields: {inherit: {type: boolean, value: false}}}
  - id: inherit.false-and-zero-stay-distinct
    kind: equality
    polarity: positive
    description: two nodes differing only in false versus 0 are different documents
    schema: {synthetic: {position: scalar}}
    a: {access: inherit, conformance: implemented, default_injection: null, inherit: false, modify: inherit, value: 1}
    b: {access: inherit, conformance: implemented, default_injection: null, inherit: 0, modify: inherit, value: 1}
    expect: {equal: false}
  - id: inherit.empty-access-list-not-replaced-by-symbol
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: {access: [], conformance: implemented, default_injection: null, inherit: true, modify: inherit, value: 1}
    expect: {fields: {access: {type: list, value: []}}}
  - id: inherit.expand-fills-symbolic-defaults
    kind: expand
    polarity: positive
    schema: {synthetic: {position: scalar}}
    input: 4
    expect: {fields: {access: {type: string, value: inherit}, conformance: {type: string, value: implemented}, default_injection: {type: 'null', value: null}, inherit: {type: boolean, value: true}, modify: {type: string, value: inherit}}}

# Source-preserving edit cases (ADR 0012, P3b). Written by hand from the rules of the ADR and docs/P3B-SOURCE-PRESERVING-EDIT.md; the tool
# tools/edit-vectors/author.py only does the byte arithmetic and tools/corpus_check.py re-checks it (EDIT_BYTES, ERROR_LOCATION). Neither Rust nor Go
# runs these cases yet: the kinds are NOT RUN until steps E2 (source_span) and E3 (edit). Do not edit this file by hand: change the tool and run it.
# Offsets are bytes of the original UTF-8 input, a leading BOM included; a span is half-open [start, end).
# Conventions: every field of the trees is optional and non-nullable; the document of a positive case validates against its tree; `routes` is a list whose
# element identity is the key `to`. Not covered here for lack of notation in the trees (no nullable, no default): editing a null token, a default-origin value, an
# empty value `key:`, and the validation errors of EDIT_INVALID_RESULT beyond the code. Anchors, aliases and tags are refused by the parser (UNSUPPORTED_SYNTAX is not
# a code of the corpus); their vectors are the parser's.
corpus_format: 2
suite: edit
status: provisional
defaults: {adr: ADR-0012, grammar: cic-primitives-73ae469-6a188078}
trees:
  doc: {name: {scalar: string}, count: {scalar: integer}, enabled: {scalar: boolean}, ip: {composite: {gateway: {scalar: string}, prefix: {scalar: integer}}}, routes: {list: {key: [to], fields: {to: {scalar: string}, metric: {scalar: integer}}}}, tags: {set: string}}
cases:
  - id: edit.span-plain
    kind: source_span
    polarity: positive
    description: "a plain scalar: from its first character to its last"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    expect: {span: {start: 6, end: 11, style: plain}}
  - id: edit.span-single-quoted
    kind: source_span
    polarity: positive
    description: "a single-quoted scalar: both quotes are in the span"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: 'alpha'\ncount: 3\n"
    expect: {span: {start: 6, end: 13, style: single_quoted}}
  - id: edit.span-double-quoted
    kind: source_span
    polarity: positive
    description: "a double-quoted scalar: both quotes are in the span"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: \"alpha\"\ncount: 3\n"
    expect: {span: {start: 6, end: 13, style: double_quoted}}
  - id: edit.span-trailing-comment
    kind: source_span
    polarity: positive
    description: "the spaces and the comment after a plain scalar are not in the span"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha   # the host\ncount: 3\n"
    expect: {span: {start: 6, end: 11, style: plain}}
  - id: edit.span-integer
    kind: source_span
    polarity: positive
    description: "an integer is a plain scalar"
    schema: {synthetic: {tree: doc}}
    path: "$.count"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    expect: {span: {start: 19, end: 20, style: plain}}
  - id: edit.span-boolean-noncanonical
    kind: source_span
    polarity: positive
    description: "a boolean spelled True is a plain scalar of four bytes"
    schema: {synthetic: {tree: doc}}
    path: "$.enabled"
    input_yaml: "enabled: True\n"
    expect: {span: {start: 9, end: 13, style: plain}}
  - id: edit.span-nested-field
    kind: source_span
    polarity: positive
    description: "a field of a composite, in block style"
    schema: {synthetic: {tree: doc}}
    path: "$.ip.gateway"
    input_yaml: "ip:\n  gateway: g1\n  prefix: 24\n"
    expect: {span: {start: 15, end: 17, style: plain}}
  - id: edit.span-expanded-value
    kind: source_span
    polarity: positive
    description: "in expanded form the span is the value: scalar, not the wrapper"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name:\n  value: alpha\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\n"
    expect: {span: {start: 15, end: 20, style: plain}}
  - id: edit.span-list-element-by-identity
    kind: source_span
    polarity: positive
    description: "a list element is found by its key, not by its index"
    schema: {synthetic: {tree: doc}}
    path: "$.routes[{to=\"b\"}].metric"
    input_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 2\n"
    expect: {span: {start: 54, end: 55, style: plain}}
  - id: edit.span-list-element-after-reorder
    kind: source_span
    polarity: positive
    description: "the same path after the elements changed places: the span moves with the element"
    schema: {synthetic: {tree: doc}}
    path: "$.routes[{to=\"b\"}].metric"
    input_yaml: "routes:\n  - to: b\n    metric: 2\n  - to: a\n    metric: 1\n"
    expect: {span: {start: 30, end: 31, style: plain}}
  - id: edit.span-equal-text-elsewhere
    kind: source_span
    polarity: positive
    description: "the same text appears twice; the span is the addressed one"
    schema: {synthetic: {tree: doc}}
    path: "$.ip.gateway"
    input_yaml: "name: abc\nip:\n  gateway: abc\n"
    expect: {span: {start: 25, end: 28, style: plain}}
  - id: edit.span-no-final-newline
    kind: source_span
    polarity: positive
    description: "a text without a final line break"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha"
    expect: {span: {start: 6, end: 11, style: plain}}
  - id: edit.span-crlf
    kind: source_span
    polarity: positive
    description: "CRLF line breaks: the span stops before the CR"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "6e616d653a20616c7068610d0a636f756e743a20330d0a"
    expect: {span: {start: 6, end: 11, style: plain}}
  - id: edit.span-lone-cr
    kind: source_span
    polarity: positive
    description: "a lone CR is a line break"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "6e616d653a20616c7068610d636f756e743a20330d"
    expect: {span: {start: 6, end: 11, style: plain}}
  - id: edit.span-bom
    kind: source_span
    polarity: positive
    description: "a leading byte order mark is counted in the offsets"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "efbbbf6e616d653a20616c7068610a"
    expect: {span: {start: 9, end: 14, style: plain}}
  - id: edit.span-non-ascii-value
    kind: source_span
    polarity: positive
    description: "the offsets are bytes: the value has multi-byte characters"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: tűrő\ncount: 3\n"
    expect: {span: {start: 6, end: 12, style: plain}}
  - id: edit.span-after-non-ascii
    kind: source_span
    polarity: positive
    description: "a scalar after multi-byte characters"
    schema: {synthetic: {tree: doc}}
    path: "$.count"
    input_yaml: "name: tűrő\ncount: 3\n"
    expect: {span: {start: 20, end: 21, style: plain}}
  - id: edit.span-refuses-literal-block
    kind: source_span
    polarity: negative
    description: "a literal block scalar"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: |\n  alpha\ncount: 3\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_BLOCK_SCALAR, phase: edit, logical_path: "$.name", source_location: {line: 1, column: 7, offset: 6}}]}
  - id: edit.span-refuses-folded-block
    kind: source_span
    polarity: negative
    description: "a folded block scalar"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: >\n  alpha\ncount: 3\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_BLOCK_SCALAR, phase: edit, logical_path: "$.name", source_location: {line: 1, column: 7, offset: 6}}]}
  - id: edit.span-refuses-multiline-plain
    kind: source_span
    polarity: negative
    description: "a plain scalar that continues on the next line"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha\n  beta\ncount: 3\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_MULTILINE_SCALAR, phase: edit, logical_path: "$.name", source_location: {line: 1, column: 7, offset: 6}}]}
  - id: edit.span-refuses-multiline-quoted
    kind: source_span
    polarity: negative
    description: "a double-quoted scalar that continues on the next line"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: \"alpha\n  beta\"\ncount: 3\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_MULTILINE_SCALAR, phase: edit, logical_path: "$.name", source_location: {line: 1, column: 7, offset: 6}}]}
  - id: edit.span-refuses-flow-context
    kind: source_span
    polarity: negative
    description: "a scalar inside a flow mapping"
    schema: {synthetic: {tree: doc}}
    path: "$.ip.gateway"
    input_yaml: "ip: {gateway: g1, prefix: 24}\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_FLOW_CONTEXT, phase: edit, logical_path: "$.ip.gateway", source_location: {line: 1, column: 15, offset: 14}}]}
  - id: edit.span-refuses-flow-set-element
    kind: source_span
    polarity: negative
    description: "the set of strings is not a scalar"
    schema: {synthetic: {tree: doc}}
    path: "$.tags"
    input_yaml: "tags: [x, y]\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_NOT_A_SCALAR, phase: edit, logical_path: "$.tags", source_location: {line: 1, column: 7, offset: 6}}]}
  - id: edit.span-refuses-block-mapping
    kind: source_span
    polarity: negative
    description: "a composite position in block style: the anchor is its first key"
    schema: {synthetic: {tree: doc}}
    path: "$.ip"
    input_yaml: "ip:\n  gateway: g1\n  prefix: 24\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_NOT_A_SCALAR, phase: edit, logical_path: "$.ip", source_location: {line: 2, column: 3, offset: 6}}]}
  - id: edit.span-refuses-flow-mapping
    kind: source_span
    polarity: negative
    description: "a composite position in flow style: the anchor is its opening brace"
    schema: {synthetic: {tree: doc}}
    path: "$.ip"
    input_yaml: "ip: {gateway: g1}\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_NOT_A_SCALAR, phase: edit, logical_path: "$.ip", source_location: {line: 1, column: 5, offset: 4}}]}
  - id: edit.span-refuses-absent-field
    kind: source_span
    polarity: negative
    description: "the position has no text: an absent field is anchored at its parent"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "count: 3\n"
    codes_status: stable
    expect: {errors: [{code: EDIT_NO_SOURCE_VALUE, phase: edit, logical_path: "$.name", source_location: {line: 1, column: 1, offset: 0}}]}
  - id: edit.span-refuses-a-parse-error
    kind: source_span
    polarity: negative
    description: "a refusal of the parse phase stays what it was"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: a\nname: b\n"
    codes_status: stable
    expect: {errors: [{code: DUPLICATE_KEY, phase: parse, source_location: {line: 2, column: 1, offset: 8}}]}
  - id: edit.span-refuses-an-unknown-path
    kind: source_span
    polarity: negative
    description: "a refusal of the path phase stays what it was"
    schema: {synthetic: {tree: doc}}
    path: "$.nope"
    input_yaml: "name: alpha\n"
    codes_status: stable
    expect: {errors: [{code: UNKNOWN_FIELD, phase: path_resolve, logical_path: "$.nope", source_location: {state: not_applicable}}]}
  - id: edit.plain-longer
    kind: edit
    polarity: positive
    description: "a plain scalar replaced by a longer value; nothing else moves but the text after it"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    value: {string: alphabet}
    expect: {output_yaml: "name: alphabet\ncount: 3\nenabled: true\n", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 14}}
  - id: edit.plain-shorter
    kind: edit
    polarity: positive
    description: "a plain scalar replaced by a shorter value"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    value: {string: al}
    expect: {output_yaml: "name: al\ncount: 3\nenabled: true\n", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 8}}
  - id: edit.single-quoted-keeps-its-quotes
    kind: edit
    polarity: positive
    description: "a single-quoted scalar stays single-quoted; a quote in the value is doubled"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: 'alpha'\ncount: 3\n"
    value: {string: "it's"}
    expect: {output_yaml: "name: 'it''s'\ncount: 3\n", span_before: {start: 6, end: 13}, span_after: {start: 6, end: 13}}
  - id: edit.double-quoted-keeps-its-quotes
    kind: edit
    polarity: positive
    description: "a double-quoted scalar stays double-quoted; a quote and a backslash in the value are escaped"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: \"alpha\"\ncount: 3\n"
    value: {string: 'say "hi" \'}
    expect: {output_yaml: "name: \"say \\\"hi\\\" \\\\\"\ncount: 3\n", span_before: {start: 6, end: 13}, span_after: {start: 6, end: 21}}
  - id: edit.trailing-comment-kept
    kind: edit
    polarity: positive
    description: "the spaces and the comment after the scalar are not touched"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha   # the host\ncount: 3\n"
    value: {string: beta}
    expect: {output_yaml: "name: beta   # the host\ncount: 3\n", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 10}}
  - id: edit.comments-around-kept
    kind: edit
    polarity: positive
    description: "own-line comments above and between, and a trailing comment of another entry, are not touched"
    schema: {synthetic: {tree: doc}}
    path: "$.count"
    input_yaml: "# top\nname: alpha # c\n# between\ncount: 3 # n\n"
    value: {integer: 4}
    expect: {output_yaml: "# top\nname: alpha # c\n# between\ncount: 4 # n\n", span_before: {start: 39, end: 40}, span_after: {start: 39, end: 40}}
  - id: edit.crlf-kept
    kind: edit
    polarity: positive
    description: "CRLF line breaks are not touched"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "6e616d653a20616c7068610d0a636f756e743a20330d0a"
    value: {string: beta}
    expect: {output_hex: "6e616d653a20626574610d0a636f756e743a20330d0a", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 10}}
  - id: edit.lone-cr-kept
    kind: edit
    polarity: positive
    description: "lone CR line breaks are not touched"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "6e616d653a20616c7068610d636f756e743a20330d"
    value: {string: beta}
    expect: {output_hex: "6e616d653a20626574610d636f756e743a20330d", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 10}}
  - id: edit.bom-kept
    kind: edit
    polarity: positive
    description: "a leading byte order mark is kept and counted in the offsets"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_hex: "efbbbf6e616d653a20616c7068610a"
    value: {string: beta}
    expect: {output_hex: "efbbbf6e616d653a20626574610a", span_before: {start: 9, end: 14}, span_after: {start: 9, end: 13}}
  - id: edit.non-ascii-new-value
    kind: edit
    polarity: positive
    description: "a value with multi-byte characters; the spans are bytes"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: tűrő\ncount: 3\n"
    value: {string: árvíz}
    expect: {output_yaml: "name: árvíz\ncount: 3\n", span_before: {start: 6, end: 12}, span_after: {start: 6, end: 13}}
  - id: edit.after-non-ascii
    kind: edit
    polarity: positive
    description: "a scalar after multi-byte characters"
    schema: {synthetic: {tree: doc}}
    path: "$.count"
    input_yaml: "name: tűrő\ncount: 3\n"
    value: {integer: 1000}
    expect: {output_yaml: "name: tűrő\ncount: 1000\n", span_before: {start: 20, end: 21}, span_after: {start: 20, end: 24}}
  - id: edit.integer-negative
    kind: edit
    polarity: positive
    description: "an integer is written in decimal"
    schema: {synthetic: {tree: doc}}
    path: "$.count"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    value: {integer: -5}
    expect: {output_yaml: "name: alpha\ncount: -5\nenabled: true\n", span_before: {start: 19, end: 20}, span_after: {start: 19, end: 21}}
  - id: edit.boolean
    kind: edit
    polarity: positive
    description: "a boolean is written lower-case"
    schema: {synthetic: {tree: doc}}
    path: "$.enabled"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    value: {boolean: false}
    expect: {output_yaml: "name: alpha\ncount: 3\nenabled: false\n", span_before: {start: 30, end: 34}, span_after: {start: 30, end: 35}}
  - id: edit.expanded-value-only
    kind: edit
    polarity: positive
    description: "in expanded form only the value: scalar changes, the Access members and the form stay"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name:\n  value: alpha\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\n"
    value: {string: beta}
    expect: {output_yaml: "name:\n  value: beta\n  access: inherit\n  modify: inherit\n  inherit: true\n  default_injection: ~\n  conformance: implemented\ncount: 3\n", span_before: {start: 15, end: 20}, span_after: {start: 15, end: 19}}
  - id: edit.list-element-by-identity
    kind: edit
    polarity: positive
    description: "the metric of the element whose key is b"
    schema: {synthetic: {tree: doc}}
    path: "$.routes[{to=\"b\"}].metric"
    input_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 2\n"
    value: {integer: 9}
    expect: {output_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 9\n", span_before: {start: 54, end: 55}, span_after: {start: 54, end: 55}}
  - id: edit.list-element-after-reorder
    kind: edit
    polarity: positive
    description: "the same edit when the elements changed places"
    schema: {synthetic: {tree: doc}}
    path: "$.routes[{to=\"b\"}].metric"
    input_yaml: "routes:\n  - to: b\n    metric: 2\n  - to: a\n    metric: 1\n"
    value: {integer: 9}
    expect: {output_yaml: "routes:\n  - to: b\n    metric: 9\n  - to: a\n    metric: 1\n", span_before: {start: 30, end: 31}, span_after: {start: 30, end: 31}}
  - id: edit.equal-text-elsewhere-untouched
    kind: edit
    polarity: positive
    description: "the same text appears twice; only the addressed one changes"
    schema: {synthetic: {tree: doc}}
    path: "$.ip.gateway"
    input_yaml: "name: abc\nip:\n  gateway: abc\n"
    value: {string: xyz}
    expect: {output_yaml: "name: abc\nip:\n  gateway: xyz\n", span_before: {start: 25, end: 28}, span_after: {start: 25, end: 28}}
  - id: edit.no-final-newline
    kind: edit
    polarity: positive
    description: "a text without a final line break stays without one"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "name: alpha"
    value: {string: beta}
    expect: {output_yaml: "name: beta", span_before: {start: 6, end: 11}, span_after: {start: 6, end: 10}}
  - id: edit.key-of-a-list-element
    kind: edit
    polarity: positive
    description: "changing a key to an unused value is an edit like any other (the element is addressed by its new key afterwards)"
    schema: {synthetic: {tree: doc}}
    path: "$.routes[{to=\"b\"}].to"
    input_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: b\n    metric: 2\n"
    value: {string: c}
    path_after: "$.routes[{to=\"c\"}].to"
    expect: {output_yaml: "routes:\n  - to: a\n    metric: 1\n  - to: c\n    metric: 2\n", span_before: {start: 40, end: 41}, span_after: {start: 40, end: 41}}
  - id: edit.noop-canonical
    kind: edit
    polarity: positive
    description: "the value does not change: the text is returned as it was"
    schema: {synthetic: {tree: doc}}
    path: "$.enabled"
    input_yaml: "name: alpha\ncount: 3\nenabled: true\n"
    value: {boolean: true}
    expect: {output_yaml: "name: alpha\ncount: 3\nenabled: true\n", span_before: {start: 30, end: 34}, span_after: {start: 30, end: 34}}
  - id: edit.noop-keeps-a-noncanonical-spelling
    kind: edit
    polarity: positive
    description: "True is the same value as true: nothing is rewritten, the spelling stays"
    schema: {synthetic: {tree: doc}}
    path: "$.enabled"
    input_yaml: "enabled: True\n"
    value: {boolean: true}
    expect: {output_yaml: "enabled: True\n", span_before: {start: 9, end: 13}, span_after: {start: 9, end: 13}}
  - id: edit.changed-writes-the-canonical-spelling
    kind: edit
    polarity: positive
    description: "a real change writes the canonical spelling of the new value"
    schema: {synthetic: {tree: doc}}
    path: "$.enabled"
    input_yaml: "enabled: True\n"
    value: {boolean: false}
    expect: {output_yaml: "enabled: false\n", span_before: {start: 9, end: 13}, span_after: {start: 9, end: 14}}
  - id: edit.refuses-a-document-without-text
    kind: edit
    polarity: negative
    description: "the document was given as a parsed value: there is no text"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    value: {string: beta}
    input: {type: map, value: {name: alpha, count: 3}}
    codes_status: stable
    expect: {errors: [{code: EDIT_NO_SOURCE_TEXT, phase: edit, logical_path: "$.name", source_location: {state: unavailable}}]}
  - id: edit.refuses-a-composite
    kind: edit
    polarity: negative
    description: "the position holds a composite"
    schema: {synthetic: {tree: doc}}
    path: "$.ip"
    input_yaml: "ip:\n  gateway: g1\n  prefix: 24\n"
    value: {string: x}
    codes_status: stable
    expect: {errors: [{code: EDIT_NOT_A_SCALAR, phase: edit, logical_path: "$.ip", source_location: {line: 2, column: 3, offset: 6}}]}
  - id: edit.refuses-an-absent-field
    kind: edit
    polarity: negative
    description: "an absent field has no text: that would be an insertion"
    schema: {synthetic: {tree: doc}}
    path: "$.name"
    input_yaml: "count: 3\n"
    value: {string: x}

# Error code registry. Every code a case expects must be listed here with its status.
# All codes are provisional until the error-contract ADR closes P0 point 6; a case that
# uses a code carries codes_status equal to the status below.
corpus_format: 1
codes:
  CONTRACT_VIOLATION: provisional
  DUPLICATE_KEY: provisional
  EXPANDED_WITH_EXTRA_KEY: provisional
  INVALID_ACCESS_VALUE: provisional
  INVALID_CERT_PATTERN: provisional
  INVALID_INHERIT: provisional
  MAP_AT_SCALAR_POSITION: provisional
  MISSING_MANDATORY: provisional
  NULL_NOT_ALLOWED: provisional
  UNKNOWN_FIELD: provisional
  PATH_BAD_ESCAPE: provisional
  PATH_CASE_AMBIGUOUS: provisional
  PATH_CASE_NONE: provisional
  PATH_DUPLICATE_COMPONENT: provisional
  PATH_DUPLICATE_IDENTITY: provisional
  PATH_EMPTY_NAME: provisional
  PATH_INDEX_SELECTOR: provisional
  PATH_INTEGER_RANGE: provisional
  PATH_KEY_MISSING: provisional
  PATH_KEY_TYPE: provisional
  PATH_KEY_UNSUPPORTED: provisional
  PATH_LIST_NOT_SELECTED: provisional
  PATH_NONCANONICAL: provisional
  PATH_NOT_A_LIST: provisional
  PATH_SELECTOR_MISMATCH: provisional
  PATH_SET_ELEMENT: provisional
  PATH_SYNTAX: provisional
  PATH_THROUGH_OPAQUE: provisional
  PATH_THROUGH_SCALAR: provisional
  PATH_UNKNOWN_FIELD: provisional

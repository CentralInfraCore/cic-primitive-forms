# Error code registry (ADR 0007). Every code a case expects is listed here.
# status: stable   = meaning, phase, trigger and anchor are closed in ADR 0007 and every
#                    listed phase has a negative vector; changed only by an ADR amendment.
#         provisional = a named open dependency remains (see the entry).
# phases: the phases the code may be reported in, each with its source anchor:
#   second_key | key | value | value_or_key | mapping | sequence | parent   (YAML text node)
#   path_text  (offset in the path text)   none  (no source anchor)
# A case that uses a code carries codes_status equal to the status below.
corpus_format: 2
codes:
  DUPLICATE_KEY:
    status: stable
    phases: {parse: second_key}
    meaning: A YAML mapping repeats a key.
    trigger: The second and later occurrence of a key in one mapping; only the first such occurrence in source order is reported.
  EXPANDED_WITH_EXTRA_KEY:
    status: stable
    phases: {recognize: mapping}
    meaning: A mapping holds every key of the Access expanded set plus another key; it is never read as data.
    trigger: Key set is a proper superset of A (ADR 0001).
  MAP_AT_SCALAR_POSITION:
    status: stable
    phases: {validate: mapping}
    meaning: A mapping stands at a position whose Shape is scalar and is not an expanded Access node.
    trigger: Recognized as short form, then the scalar position receives a map (ADR 0001).
  UNKNOWN_FIELD:
    status: stable
    phases: {path_resolve: none, validate: key}
    meaning: A name is not a declared field at that location.
    trigger: A document key the Shape does not declare (validate); a path field segment the schema does not declare (path_resolve).
  MISSING_MANDATORY:
    status: stable
    phases: {validate: parent}
    meaning: A mandatory field is absent.
    trigger: The key is missing from its parent mapping (ADR 0003); the parent is the anchor because an absent field has no source position.
  NULL_NOT_ALLOWED:
    status: stable
    phases: {validate: value_or_key}
    meaning: A null value where the field is not nullable.
    trigger: Explicit null or an empty scalar on a non-nullable field (ADR 0003); an empty scalar has no text of its own, so the key is the anchor.
  MIN_ITEMS_NOT_MET:
    status: stable
    phases: {validate: sequence}
    meaning: A list has fewer items than its min_items contract.
    trigger: Item count below min_items (ADR 0003). Other contract kinds get their own codes when they are specified.
  INVALID_ACCESS_VALUE:
    status: provisional
    phases: {validate: value}
    meaning: An access or modify value is neither the symbol inherit nor a list of CertPattern.
    trigger: 'Wrong kind of value (ADR 0004). Provisional: the union type is an open upstream decision (cic-primitives #17).'
  INVALID_CERT_PATTERN:
    status: provisional
    phases: {validate: value}
    meaning: An element of an access or modify list is not a valid CertPattern.
    trigger: 'Element is not a field=value pattern (ADR 0004). Provisional: depends on the same upstream decision.'
  INVALID_INHERIT:
    status: provisional
    phases: {validate: value}
    meaning: The inherit key holds a value outside true, false, 0.
    trigger: 'Type-strict check of the three-valued inherit key (ADR 0004). Provisional: the normative false-versus-0 semantics is an open upstream decision.'
  PATH_SYNTAX:
    status: stable
    phases: {path_format: none, path_parse: path_text}
    meaning: The path text (or a name to be written) is malformed.
    trigger: Missing root marker, unescaped special character, unclosed selector, bad token, control character; offset is the first character that cannot continue a valid path, or the text length at premature end.
  PATH_BAD_ESCAPE:
    status: stable
    phases: {path_parse: path_text}
    meaning: A backslash escape that the grammar does not define.
    trigger: Unknown or truncated escape; offset is the backslash.
  PATH_EMPTY_NAME:
    status: stable
    phases: {path_format: none, path_parse: path_text}
    meaning: A field or selector component name is empty.
    trigger: Offset is the first character after the introducing dot, or the equals sign of an empty component name.
  PATH_INDEX_SELECTOR:
    status: stable
    phases: {path_parse: path_text}
    meaning: A list element is selected by position.
    trigger: A selector that starts with a digit or minus instead of a keyed record; offset is the opening bracket.
  PATH_DUPLICATE_COMPONENT:
    status: stable
    phases: {path_parse: path_text}
    meaning: A selector names the same key component twice.
    trigger: Offset is the start of the second name.
  PATH_NONCANONICAL:
    status: stable
    phases: {path_parse: path_text}
    meaning: A valid reading exists but the text is not the canonical writing.
    trigger: Leading zero, plus sign, minus zero, needless or uppercase unicode escape, escaped slash; offset is the start of the token or the backslash.
  PATH_INTEGER_RANGE:
    status: provisional
    phases: {path_format: none, path_parse: path_text}
    meaning: An integer key lies outside signed 64 bits.
    trigger: 'Offset is the start of the integer token. Provisional: a numeric contract does not exist yet (ADR 0006).'
  PATH_NO_CHILDREN:
    status: stable
    phases: {path_resolve: none}
    meaning: A path continues below a position that has no addressable children.
    trigger: A field segment after a scalar, a set field or an opaque field.
  PATH_SET_ELEMENT:
    status: stable
    phases: {path_resolve: none}
    meaning: A selector addresses an element of a set.
    trigger: Set elements are not independently addressable (ADR 0006).
  PATH_NOT_A_LIST:
    status: stable
    phases: {path_resolve: none}
    meaning: A selector follows a field that is not a list.
    trigger: Scalar, composite or opaque field followed by a selector.
  PATH_LIST_NOT_SELECTED:
    status: stable
    phases: {path_resolve: none}
    meaning: A list field is used as a container without selecting an element.
    trigger: A field segment directly after a list field.
  PATH_SELECTOR_MISMATCH:
    status: stable
    phases: {path_resolve: none}
    meaning: A selector does not match the declared identity of the list.
    trigger: Components missing, extra, unknown, not in the declared order, or naming keys of two item_choice cases.
  PATH_KEY_TYPE:
    status: stable
    phases: {path_of: none, path_resolve: none, validate: value}
    meaning: A key value has the wrong kind for the declared key type.
    trigger: A quoted value for an integer key or the reverse (path_resolve); a document key value of the wrong type (path_of). In validate, the key value of an element, anchored at that value.
  PATH_KEY_UNSUPPORTED:
    status: provisional
    phases: {path_format: none, path_of: none, path_resolve: none, validate: value}
    meaning: The key field has a type with no defined path encoding.
    trigger: 'Boolean, number or bytes key. Provisional: the encodings are undecided (ADR 0006). In validate, the key field of an element has such a type, anchored at the key value.'
  PATH_DUPLICATE_IDENTITY:
    status: stable
    phases: {path_of: none, validate: mapping}
    meaning: Two elements of one list have the same identity.
    trigger: Never mapped to an index (ADR 0006). In validate, reported once per identity, anchored at the second element that has it.
  PATH_KEY_MISSING:
    status: stable
    phases: {path_of: none, validate: mapping}
    meaning: A key component of a list element is absent.
    trigger: Plain list element lacks a key field (ADR 0006). In validate (ADR 0007 amendment), the same fact while validating a list element, anchored at the element's record.
  PATH_CASE_NONE:
    status: stable
    phases: {path_of: none, validate: mapping}
    meaning: No item_choice case matches the element.
    trigger: ADR 0002 matching finds zero cases. In validate, anchored at the element's record.
  PATH_CASE_AMBIGUOUS:
    status: stable
    phases: {path_of: none, validate: mapping}
    meaning: More than one item_choice case matches the element.
    trigger: ADR 0002 matching finds several cases. In validate, anchored at the element's record.
  DIFF_CONTEXT_MISMATCH:
    status: stable
    phases: {diff: none}
    meaning: The two views of a diff were read under different schema, grammar or surface contexts.
    trigger: The contexts of the operands are not identical; comparing them needs an explicit compatibility or mapping contract (ADR 0008).
  DIFF_UNSUPPORTED_VALUE:
    status: provisional
    phases: {diff: none}
    meaning: A view holds a value with no canonical serialization yet.
    trigger: A float, or an integer outside signed 64 bits, anywhere in an operand, whether or not it takes part in a difference (ADR 0008). Provisional because a numeric contract does not exist.
  INVALID_CONFORMANCE_VALUE:
    status: stable
    phases: {validate: value}
    meaning: The conformance key holds a value outside the closed enum of the Access atom.
    trigger: Not exactly one of the strings implemented, not_implemented, deprecated (type-strict), whatever the origin of the document (ADR 0010).
  CONFORMANCE_NOT_AUTHORABLE:
    status: stable
    phases: {validate: value}
    meaning: A device capability other than implemented is stated where no trusted binding datum supports it.
    trigger: An authored long form with conformance not_implemented or deprecated, or the same value in a materialized document at a position that is not among the attested positions (ADR 0010).
  ORIGIN_ATTESTATION_MISMATCH:
    status: stable
    phases: {validate: none}
    meaning: The origin supplied with a document and its attestation contradict each other.
    trigger: Origin materialized without an attestation reference or without attested positions, or origin authored with either (ADR 0010). A context error, so it has no source anchor.

  GRAMMAR_DIGEST_MISMATCH:
    status: stable
    phases: {validate: none}
    meaning: The grammar files supplied to the library do not reproduce the declared manifest digest.
    trigger: The digest of the manifest of the supplied (path, SHA-256) entries, sorted by the UTF-8 bytes of the path, differs from the declared digest; a missing, extra or changed file all change it (ADR 0002). A context error, so it has no source anchor.
  # ---- phase edit (ADR 0012): the first unit of P3b replaces one existing single-line scalar. One error, the first failing condition in the fixed order of
  # ADR 0012 section 4. The twelfth condition of the design note, EDIT_SPAN_MISMATCH (the read-back of the span disagrees with the parser), is an internal
  # assertion that no input can cause on purpose: it has no conformance vector and is not registered; its proof is a seeded defect of each implementation.
  EDIT_NO_SOURCE_TEXT:
    status: stable
    phases: {edit: value}
    meaning: The document was supplied as an already parsed value, so there is no source text to edit.
    trigger: edit_scalar called with a parsed document (source_location is the state unavailable, as in ADR 0007).
  EDIT_NOT_A_SCALAR:
    status: stable
    phases: {edit: value}
    meaning: The addressed position holds a composite, a list or a set; the first edit unit replaces one scalar.
    trigger: The path resolves to a primitive position whose value is not a scalar.
  EDIT_NO_SOURCE_VALUE:
    status: stable
    phases: {edit: parent}
    meaning: The position has no value text of its own (absent, an empty value, or a value that normalization inserted as a default); replacing it would be an insertion.
    trigger: The path resolves, and the document spells no scalar for that position.
  EDIT_BLOCK_SCALAR:
    status: stable
    phases: {edit: value}
    meaning: The scalar is a block scalar (literal or folded); its indentation and chomping make a safe replacement a later unit.
    trigger: The addressed scalar starts with a block indicator.
  EDIT_FLOW_CONTEXT:
    status: stable
    phases: {edit: value}
    meaning: The scalar is inside a flow collection; the end of its text depends on the flow indicators.
    trigger: The addressed scalar is inside braces or brackets.
  EDIT_MULTILINE_SCALAR:
    status: stable
    phases: {edit: value}
    meaning: The scalar continues on more than one line (a folded plain or quoted scalar).
    trigger: The addressed scalar's text spans a line break.
  EDIT_VALUE_NOT_REPRESENTABLE:
    status: stable
    phases: {edit: value}
    meaning: The new value holds a line break or a control character, or is not valid UTF-8; the first unit writes none of them.
    trigger: The new value contains such a character.
  EDIT_TYPE_MISMATCH:
    status: stable
    phases: {edit: value}
    meaning: The new value is not the kind of scalar the position has, or the schema does not allow it there.
    trigger: The typed new value does not match the scalar type of the addressed position.
  EDIT_STYLE_CONFLICT:
    status: stable
    phases: {edit: value}
    meaning: The scalar's existing style cannot carry the new value, and the edit never changes a style.
    trigger: A plain scalar and a value that is not plain-safe, or a quoted scalar and a value its quotes cannot carry.
  EDIT_INVALID_RESULT:
    status: stable
    phases: {edit: value}
    meaning: The edited document would not validate where the original did (for example a changed key makes two list elements share one identity).
    trigger: The result of the replacement fails validation.
  PATCH_CONTEXT_MISMATCH:
    status: stable
    phases: {patch: none}
    meaning: The context the caller passed does not match the schema it passed, or the diff has a version the patch does not know. It never says under which context a diff was made (nothing in the inputs can show that, ADR 0013 section 5).
    trigger: The schema identity or digest, the grammar or the surface of the context differ from the schema given, or the version of the diff is not 1.
  PATCH_UNSUPPORTED_EVENT:
    status: stable
    phases: {patch: none}
    meaning: The diff holds an event or a target the first unit of patch does not apply; the whole patch is refused and nothing is applied in part (ADR 0013 section 2).
    trigger: An added, removed, policy_declaration_change or set_change event; a value_change on an opaque position, a composite, a list, or a key component of a list element.
  PATCH_DUPLICATE_TARGET:
    status: stable
    phases: {patch: none}
    meaning: Two events of the diff name the same path; the patch is refused as a whole and nothing is applied (ADR 0013 section 3, row 3a). Each of the two is an event the first unit applies; it is the pair that contradicts itself.
    trigger: A diff handed to the patch directly, with one path in two value_change events (the bytes of such a diff are refused by ReadDiff with the reason order); the error names the path of the later event.
  PATCH_TARGET_ABSENT:
    status: stable
    phases: {patch: parent}
    meaning: The path of an event resolves against the schema, but the document does not hold that position.
    trigger: A field the document does not spell, or a list element of an identity the list does not hold.
  PATCH_CONFLICT:
    status: stable
    phases: {patch: value}
    meaning: The value the document holds at the path is not the previous value of the event, type-strict; this is also what a second application of a diff with effective changes is.
    trigger: The scalar at the path differs from `previous` (0 is not false, "3" is not 3).

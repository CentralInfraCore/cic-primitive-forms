# Provisional presence cases for ADR 0003. Format: ADR 0005.
# schema.synthetic.shape is a fixture notation, NOT a schema; the shared runner binds it to the
# real Shape members. presence = mandatory | optional; nullable defaults to false.
# default_candidate: the default may be considered; whether it applies depends on Role (P3).
# absent: true means the key is missing (not a value); otherwise input holds the present value,
# which may be null, "", [], {}, 0 or false. roundtrip expectations are typed values; Absent is
# {type: absent}.
corpus_format: 2
suite: presence
status: provisional
defaults: {adr: ADR-0003, grammar: cic-primitives-73ae469-6a188078}
cases:
  - id: presence.mandatory-absent
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    absent: true
    expect: {errors: [{code: MISSING_MANDATORY, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.mandatory-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    input: null
    expect: {errors: [{code: NULL_NOT_ALLOWED, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.mandatory-nullable-null
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: mandatory, type: string}}}
    input: null
    expect: {valid: true}
  - id: presence.mandatory-nullable-absent
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {nullable: true, presence: mandatory, type: string}}}
    absent: true
    expect: {errors: [{code: MISSING_MANDATORY, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.mandatory-empty-string
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    input: ''
    expect: {valid: true}
  - id: presence.optional-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: optional, type: string}}}
    absent: true
    expect: {stays_absent: true, valid: true}
  - id: presence.optional-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: optional, type: string}}}
    input: null
    expect: {errors: [{code: NULL_NOT_ALLOWED, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.optional-nullable-null
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: optional, type: string}}}
    input: null
    expect: {valid: true}
  - id: presence.optional-nullable-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: optional, type: string}}}
    absent: true
    expect: {stays_absent: true, valid: true}
  - id: presence.zero-is-a-value
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    input: 0
    expect: {default_candidate: false, valid: true}
  - id: presence.false-is-a-value
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: true, presence: optional, type: boolean}}}
    input: false
    expect: {default_candidate: false, valid: true}
  - id: presence.default-trigger-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    absent: true
    expect: {default_candidate: true, valid: true}
  - id: presence.default-not-triggered-by-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    input: null
    expect: {default_candidate: false, errors: [{code: NULL_NOT_ALLOWED, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.default-not-triggered-by-empty-string
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: x, presence: optional, type: string}}}
    input: ''
    expect: {default_candidate: false, valid: true}
  - id: presence.list-empty-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: optional, type: list}}}
    input: []
    expect: {valid: true}
  - id: presence.list-empty-below-min-items
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {min_items: 1, presence: optional, type: list}}}
    input: []
    expect: {errors: [{code: MIN_ITEMS_NOT_MET, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.map-empty-composite-all-optional
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {fields: {a: optional}, presence: optional, type: composite}}}
    input: {}
    expect: {valid: true}
  - id: presence.map-empty-composite-mandatory-child
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {fields: {a: mandatory}, presence: optional, type: composite}}}
    input: {}
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.absent-stays-absent
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    absent: true
    expect: {collapsed: {type: absent}, expanded: {type: absent}}
  - id: presence.null-stays-null
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: null
    expect: {collapsed: {type: 'null', value: null}, expanded: {type: 'null', value: null}}
  - id: presence.empty-string-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: ''
    expect: {collapsed: {type: string, value: ''}, expanded: {type: string, value: ''}}
  - id: presence.empty-list-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: []
    expect: {collapsed: {type: list, value: []}, expanded: {type: list, value: []}}
  - id: presence.empty-map-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {}
    expect: {collapsed: {type: map, value: {}}, expanded: {type: map, value: {}}}
  - id: presence.value-null-and-default-injection-are-separate
    kind: collapse
    polarity: positive
    description: value null is data; default_injection 0 is access behavior and must survive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: 0, inherit: true, modify: inherit, value: null}
    authored_expanded: false
    expect: {collapse: expanded, fields: {default_injection: {type: integer, value: 0}, value: {type: 'null', value: null}}}
  - id: presence.expanded-without-value-key-is-not-expanded
    kind: recognize
    polarity: negative
    description: an expanded node lacks the value key, so by ADR 0001 it is short and then rejected at a scalar position
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit}
    expect: {class: short, errors: [{code: MAP_AT_SCALAR_POSITION, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.null-spelled-as-empty-scalar
    kind: validate
    polarity: negative
    description: '`input:` with no value is YAML null, the same as `input: null` (ADR 0003); it is not an empty string'
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    input: null
    expect: {errors: [{code: NULL_NOT_ALLOWED, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.map-with-code-and-error-keys-is-data
    kind: roundtrip
    polarity: positive
    description: keys named code and error inside data are data, never test-control metadata
    schema: {synthetic: {position: opaque}}
    input: {code: '200', error: none-so-far}
    expect: {collapsed: {type: map, value: {code: '200', error: none-so-far}}, expanded: {type: map, value: {code: '200', error: none-so-far}}}
  - id: presence.text-unknown-field
    kind: validate
    polarity: negative
    description: the anchor is the key of the unknown field
    schema: {synthetic: {shape: {fields: {a: optional}, presence: optional, type: composite}}}
    input_yaml: "a: 1\nzz: 2\n"
    expect: {errors: [{code: UNKNOWN_FIELD, logical_path: $.zz, phase: validate, source_location: {column: 1, line: 2, offset: 5}}]}
    codes_status: stable
  - id: presence.text-missing-mandatory-anchors-parent
    kind: validate
    polarity: negative
    description: an absent field has no position; the parent mapping, which starts at its first key, is the anchor
    schema: {synthetic: {shape: {fields: {a: mandatory, b: optional}, presence: optional, type: composite}}}
    input_yaml: "\n# nothing\nb: 1\n"
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {column: 1, line: 3, offset: 11}}]}
    codes_status: stable
  - id: presence.text-null-explicit-anchors-value
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {fields: {a: mandatory}, presence: optional, type: composite}}}
    input_yaml: "a: null\n"
    expect: {errors: [{code: NULL_NOT_ALLOWED, logical_path: $.a, phase: validate, source_location: {column: 4, line: 1, offset: 3}}]}
    codes_status: stable
  - id: presence.text-null-empty-scalar-anchors-key
    kind: validate
    polarity: negative
    description: an empty scalar has no text of its own; the key is the anchor
    schema: {synthetic: {shape: {fields: {a: mandatory}, presence: optional, type: composite}}}
    input_yaml: "a:\n"
    expect: {errors: [{code: NULL_NOT_ALLOWED, logical_path: $.a, phase: validate, source_location: {column: 1, line: 1, offset: 0}}]}
    codes_status: stable
  - id: presence.text-min-items-anchors-sequence
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {min_items: 1, presence: optional, type: list}}}
    input_yaml: "# c\n[]\n"
    expect: {errors: [{code: MIN_ITEMS_NOT_MET, phase: validate, source_location: {column: 1, line: 2, offset: 4}}]}
    codes_status: stable
  - id: presence.errors-sorted-by-logical-path-not-declaration
    kind: validate
    polarity: negative
    description: order is fixed by the logical path, so a different traversal order cannot change the response
    schema: {synthetic: {shape: {fields: {a: mandatory, b: mandatory, c: mandatory}, presence: optional, type: composite}}}
    input: {}
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {state: unavailable}}, {code: MISSING_MANDATORY, logical_path: $.b, phase: validate, source_location: {state: unavailable}}, {code: MISSING_MANDATORY, logical_path: $.c, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.errors-mixed-codes-sorted-by-path
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {fields: {a: mandatory, b: mandatory}, presence: optional, type: composite}}}
    input: {b: null, zz: 1}
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {state: unavailable}}, {code: NULL_NOT_ALLOWED, logical_path: $.b, phase: validate, source_location: {state: unavailable}}, {code: UNKNOWN_FIELD, logical_path: $.zz, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable
  - id: presence.text-errors-with-locations
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {fields: {a: mandatory, b: mandatory}, presence: optional, type: composite}}}
    input_yaml: "b: null\nzz: 1\n"
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {column: 1, line: 1, offset: 0}}, {code: NULL_NOT_ALLOWED, logical_path: $.b, phase: validate, source_location: {column: 4, line: 1, offset: 3}}, {code: UNKNOWN_FIELD, logical_path: $.zz, phase: validate, source_location: {column: 1, line: 2, offset: 8}}]}
    codes_status: stable
  - id: presence.text-errors-order-ignores-source-order
    kind: validate
    polarity: negative
    description: zz comes first in the text and last in the response
    schema: {synthetic: {shape: {fields: {a: mandatory, b: mandatory}, presence: optional, type: composite}}}
    input_yaml: "zz: 1\nb: null\n"
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a, phase: validate, source_location: {column: 1, line: 1, offset: 0}}, {code: NULL_NOT_ALLOWED, logical_path: $.b, phase: validate, source_location: {column: 4, line: 2, offset: 9}}, {code: UNKNOWN_FIELD, logical_path: $.zz, phase: validate, source_location: {column: 1, line: 1, offset: 0}}]}
    codes_status: stable
  - id: presence.errors-sorted-by-segments-not-by-text
    kind: validate
    polarity: negative
    description: "'$.a b' sorts before '$.a.x' as text (space before dot) but after it segment by segment (name a before name 'a b'); the segment order is the contract"
    schema: {synthetic: {shape: {fields: {a: {fields: {x: mandatory}, presence: optional}, a b: mandatory}, presence: optional, type: composite}}}
    input: {a: {}}
    expect: {errors: [{code: MISSING_MANDATORY, logical_path: $.a.x, phase: validate, source_location: {state: unavailable}}, {code: MISSING_MANDATORY, logical_path: $.a b, phase: validate, source_location: {state: unavailable}}]}
    codes_status: stable

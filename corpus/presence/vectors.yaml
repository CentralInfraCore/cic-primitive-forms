# Provisional presence cases for ADR 0003. Format: ADR 0005.
# schema.synthetic.shape is a fixture notation, NOT a schema; the shared runner binds it to the
# real Shape members. presence = mandatory | optional; nullable defaults to false.
# default_candidate: the default may be considered; whether it applies depends on Role (P3).
# absent: true means the key is missing (not a value); otherwise input holds the present value,
# which may be null, "", [], {}, 0 or false. roundtrip expectations are typed values; Absent is
# {type: absent}.
corpus_format: 1
suite: presence
status: provisional
defaults: {adr: ADR-0003, grammar: cic-primitives-devel}
cases:
  - id: presence.mandatory-absent
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    absent: true
    expect: {error: MISSING_MANDATORY}
    codes_status: provisional
  - id: presence.mandatory-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    input: null
    expect: {error: NULL_NOT_ALLOWED}
    codes_status: provisional
  - id: presence.mandatory-nullable-null
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: mandatory, type: string}}}
    input: null
    expect: {valid: true}
  - id: presence.mandatory-nullable-absent
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {nullable: true, presence: mandatory, type: string}}}
    absent: true
    expect: {error: MISSING_MANDATORY}
    codes_status: provisional
  - id: presence.mandatory-empty-string
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: mandatory, type: string}}}
    input: ''
    expect: {valid: true}
  - id: presence.optional-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: optional, type: string}}}
    absent: true
    expect: {stays_absent: true, valid: true}
  - id: presence.optional-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {presence: optional, type: string}}}
    input: null
    expect: {error: NULL_NOT_ALLOWED}
    codes_status: provisional
  - id: presence.optional-nullable-null
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: optional, type: string}}}
    input: null
    expect: {valid: true}
  - id: presence.optional-nullable-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {nullable: true, presence: optional, type: string}}}
    absent: true
    expect: {stays_absent: true, valid: true}
  - id: presence.zero-is-a-value
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    input: 0
    expect: {default_candidate: false, valid: true}
  - id: presence.false-is-a-value
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: true, presence: optional, type: boolean}}}
    input: false
    expect: {default_candidate: false, valid: true}
  - id: presence.default-trigger-absent
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    absent: true
    expect: {default_candidate: true, valid: true}
  - id: presence.default-not-triggered-by-null
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {default: 5, presence: optional, type: integer}}}
    input: null
    expect: {default_candidate: false, error: NULL_NOT_ALLOWED}
    codes_status: provisional
  - id: presence.default-not-triggered-by-empty-string
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {default: x, presence: optional, type: string}}}
    input: ''
    expect: {default_candidate: false, valid: true}
  - id: presence.list-empty-ok
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {presence: optional, type: list}}}
    input: []
    expect: {valid: true}
  - id: presence.list-empty-below-min-items
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {min_items: 1, presence: optional, type: list}}}
    input: []
    expect: {error: CONTRACT_VIOLATION}
    codes_status: provisional
  - id: presence.map-empty-composite-all-optional
    kind: validate
    polarity: positive
    schema: {synthetic: {shape: {fields: {a: optional}, presence: optional, type: composite}}}
    input: {}
    expect: {valid: true}
  - id: presence.map-empty-composite-mandatory-child
    kind: validate
    polarity: negative
    schema: {synthetic: {shape: {fields: {a: mandatory}, presence: optional, type: composite}}}
    input: {}
    expect: {error: MISSING_MANDATORY, path: a}
    codes_status: provisional
  - id: presence.absent-stays-absent
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    absent: true
    expect: {collapsed: {type: absent}, expanded: {type: absent}}
  - id: presence.null-stays-null
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: null
    expect: {collapsed: {type: 'null', value: null}, expanded: {type: 'null', value: null}}
  - id: presence.empty-string-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: ''
    expect: {collapsed: {type: string, value: ''}, expanded: {type: string, value: ''}}
  - id: presence.empty-list-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: []
    expect: {collapsed: {type: list, value: []}, expanded: {type: list, value: []}}
  - id: presence.empty-map-preserved
    kind: roundtrip
    polarity: positive
    schema: {synthetic: {position: opaque}}
    input: {}
    expect: {collapsed: {type: map, value: {}}, expanded: {type: map, value: {}}}
  - id: presence.value-null-and-default-injection-are-separate
    kind: collapse
    polarity: positive
    description: value null is data; default_injection 0 is access behavior and must survive
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: 0, inherit: true, modify: inherit, value: null}
    authored_expanded: false
    expect: {collapse: expanded, fields: {default_injection: {type: integer, value: 0}, value: {type: 'null', value: null}}}
  - id: presence.expanded-without-value-key-is-not-expanded
    kind: recognize
    polarity: negative
    description: an expanded node lacks the value key, so by ADR 0001 it is short and then rejected at a scalar position
    schema: {synthetic: {position: scalar}}
    input: {access: inherit, conformance: implemented, default_injection: null, inherit: true, modify: inherit}
    expect: {class: short, validate: {code: MAP_AT_SCALAR_POSITION}}
    codes_status: provisional

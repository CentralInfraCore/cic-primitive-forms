# Pinned external sources the corpus refers to (ADR 0002, ADR 0005).
# Nothing is vendored: cic-schema-registry and cic-primitives are CC BY-NC-SA 4.0. The upstream licence
# text (LICENSE.md of cic-primitives) is itself part of the grammar file set, so the licence of the pinned
# bytes is bound by the same manifest as the bytes.
#
# History: cic-primitives-5a26bd8-76f1d664 (the seven-file set at devel 5a26bd8) was replaced by this pin
# when D-018 (access-policy/1, cic-primitives PR #19 and #20) was adopted; every `grammar:` reference was
# migrated on purpose, see docs/adr/0004 (adoption record).
#
# A grammar pin is an identity (ADR 0002): the immutable commit plus a manifest of exactly the
# accepted file set (tools/grammar_identity.py: GRAMMAR_FILES). `files` lists each path with the
# SHA-256 of its raw Git blob bytes at the commit, sorted by the UTF-8 bytes of the path.
# `manifest_sha256` is the SHA-256 of the `sha256sum`-format text of those lines. The pin name
# carries the identity, <repo>-<commit7>-<manifest8>, so re-pinning changes the name and every
# `grammar:` reference breaks until it is migrated on purpose.
# The offline gate checks the structure; CI reproduces every hash from the upstream commit.

[package]
name = "engine-harness-rust"
version = "0.0.0"
edition = "2021"
publish = false

# P5-2 (ADR 0014, decision A): the engine is the oracle. This program builds the engine's own MaterializedObject from the shared cases
# (testdata/p5/materialize.json) with the engine's try_new and computes materialized_object_digest. It runs against the pinned engine checkout that CI puts at
# upstream/cic-primitive-engine.
[dependencies]
cic-primitive-engine = { path = "../../../upstream/cic-primitive-engine/engine" }
serde_json = "1"

[workspace]

[package]
name = "rustbranch"
version = "0.1.0"
edition = "2021"
description = "cic-branch/1 branch coverage measurement for Rust crates (ADR 0009)"
license = "Apache-2.0"

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut", "parsing", "printing", "clone-impls", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

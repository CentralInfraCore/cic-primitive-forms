name: proof-plan
# The proof-aware execution planner, REPORT ONLY (tools/proof-plan/README.md).
#
# It decides, for every Go and Rust test, whether an earlier result could stand (REUSE_ELIGIBLE / RERUN_REQUIRED / UNVERIFIABLE), then runs the
# tests anyway and sets the decision against what they did. Nothing is skipped and no other workflow depends on this one; it is not a
# required check and a failure of it changes nothing. The evidence of a run is left as the artifact `proof-evidence`, which the next run
# finds (the newest successful run on main whose commit is an ancestor of the tested commit).
#
# It does not replace p1: the gates of p1 keep their meaning, and everything without a rule of its own stays a run.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
  actions: read   # to find and download the artifact of an earlier run
env:
  RUST_TOOLCHAIN: "1.99.1"   # as p1
concurrency:
  group: proof-plan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true   # report only: never a failure of the pull request
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the ancestors of the commit
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go/go.sum
            tools/proof-plan/extractor/typeddeps/go.sum
            tools/proof-plan/extractor/scipdeps/go.sum
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-analyzer
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Self-test of the planner
        run: python3 -m unittest tools/proof-plan/test_plan.py tools/proof-plan/test_merkle.py
      - name: Build the extractors reproducibly (the identity of a build is the digest of its binary)
        env:
          CGO_ENABLED: "0"   # static: the result must not depend on the C toolchain of the runner
        run: |
          # -trimpath: no build paths. -buildvcs=false: no commit/time stamp (a binary that carries the revision is another extractor at
          # every commit, so the evidence of the commit before is never accepted). Built twice and compared: the identity must not depend on the run.
          for d in "$RUNNER_TEMP/pp" "$RUNNER_TEMP/pp2"; do
            mkdir -p "$d"
            (cd tools/proof-plan/extractor/typeddeps && go build -trimpath -buildvcs=false -o "$d/typeddeps" .)
            (cd tools/proof-plan/extractor/scipdeps && go build -trimpath -buildvcs=false -o "$d/scipdeps" .)
          done
          { echo '### Extractor builds'; echo '```'; sha256sum "$RUNNER_TEMP"/pp/typeddeps "$RUNNER_TEMP"/pp/scipdeps; \
            cmp "$RUNNER_TEMP/pp/typeddeps" "$RUNNER_TEMP/pp2/typeddeps" && cmp "$RUNNER_TEMP/pp/scipdeps" "$RUNNER_TEMP/pp2/scipdeps" \
              && echo 'two builds in this job: identical' || echo 'TWO BUILDS IN THIS JOB DIFFER: the build is not reproducible'; \
            go version -m "$RUNNER_TEMP/pp/typeddeps" | grep -E 'build|vcs|mod' | head -12; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Find the evidence of an earlier run
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # main always; the pull request's own branch too, but only for a branch of this repository (never a fork's artifact)
          BRANCHES="--branch main"
          if [ "$SAME_REPO" = "true" ]; then BRANCHES="$BRANCHES --branch $HEAD_REF"; fi
          python3 tools/proof-plan/find_prev.py --repo "$GITHUB_REPOSITORY" --workflow proof-plan.yml --out "$RUNNER_TEMP/prev" $BRANCHES >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f "$RUNNER_TEMP/prev/evidence.json" ]; then echo "dir=$RUNNER_TEMP/prev" >> "$GITHUB_OUTPUT"; fi
      # The qualification of the extractor builds (the probes) depends on the binaries, the probes and the toolchains, not on the tree under test: it
      # is kept between runs. plan.py reads the file only if it was made for exactly these identities, probes and toolchains (the key below is only
      # a way to find it; a file for anything else is ignored and measured again).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/qual
          key: proof-qual-${{ runner.os }}-${{ hashFiles('tools/proof-plan/**', '!**/__pycache__/**') }}   # the self-test leaves .pyc files: they must not move the key
          restore-keys: |
            proof-qual-${{ runner.os }}-
      - name: Plan (decide, nothing is skipped)
        run: |
          python3 tools/proof-plan/plan.py --repo . --typeddeps "$RUNNER_TEMP/pp/typeddeps" --scipdeps "$RUNNER_TEMP/pp/scipdeps" \
            --rust-toolchain "$RUST_TOOLCHAIN" --out "$RUNNER_TEMP/plan" --qual-cache "$RUNNER_TEMP/qual/qualification.json" --sha "$GITHUB_SHA" ${{ steps.prev.outputs.dir && format('--prev {0}', steps.prev.outputs.dir) || '' }}
      - name: Observe the Go tests (the command of p1)
        run: python3 tools/proof-plan/record.py observe-go --repo . --out "$RUNNER_TEMP/go.json"
      - name: Observe the Rust tests
        run: python3 tools/proof-plan/record.py observe-rust --repo . --rust-toolchain "$RUST_TOOLCHAIN" --out "$RUNNER_TEMP/rust.json"
      - name: The Proof-Aware Execution Report and the evidence of this run
        run: |
          python3 tools/proof-plan/record.py finish --plan "$RUNNER_TEMP/plan" --observed "$RUNNER_TEMP/go.json" --observed "$RUNNER_TEMP/rust.json" \
            ${{ steps.prev.outputs.dir && format('--prev {0}', steps.prev.outputs.dir) || '' }} --out "$RUNNER_TEMP/out" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lay the artifact out flat (upload-artifact keeps the common parent of several paths)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          cp "$RUNNER_TEMP/out/evidence.json" "$RUNNER_TEMP/out/comparison.json" "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/plan/timings.json" "$RUNNER_TEMP/artifact/" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: proof-evidence
          path: ${{ runner.temp }}/artifact
          retention-days: 90

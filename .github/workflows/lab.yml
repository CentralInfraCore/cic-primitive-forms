name: lab
# The verification lab branch (lab/README.md). The gate workflows of main were moved to lab/ci-reference/workflows, so a push or a
# pull request on this branch runs only what is here. This job only shows that the subject code still builds and passes its tests.
on:
  push:
    branches: ["lab/**"]
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.99.1"
jobs:
  subject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - run: go test -count=1 ./...
        working-directory: go
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: cargo +"$RUST_TOOLCHAIN" test --locked
        working-directory: rust
  # How exact is the dependency graph? The typed graph (lab/extractor/typeddeps) and the knowledge base's graph (go.meta.gen.py)
  # against what each Go test executes; red if the typed graph misses a function a test ran, or if a planted defect is not seen.
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go/go.sum
            lab/extractor/typeddeps/go.sum
      - run: pip install pyyaml
      - run: lab/measure/run.sh "$RUNNER_TEMP/lab-out"
        env:
          CIC_FORMS_ROOT: ${{ github.workspace }}
      # the Merkle key moves for exactly the nodes that reach a changed declaration: every node of the graph, one at a time
      - run: MERKLE_GRAPH="$RUNNER_TEMP/lab-out/typed.json" python3 -m unittest lab/measure/test_merkle.py
      # KNOWN-VULNERABILITY REPRODUCTION (lab/testdata/iota/README.md): green here means the defect is STILL PRESENT in the extractor
      # (an implicit-iota constant has no edge to its value); it is not a statement that the verification is correct. When the
      # extractor is fixed this step becomes --expect fixed.
      - run: python3 lab/measure/repro_iota.py "$RUNNER_TEMP/lab-out/typeddeps" --expect vulnerable --record "$RUNNER_TEMP/lab-out/iota-red.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: graph-measurement
          path: |
            ${{ runner.temp }}/lab-out/*.json
  # The verification kernel (lab/measure/evidence.py): a pure decision, REUSE_ELIGIBLE / RERUN_REQUIRED / UNVERIFIABLE. No toolchain.
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m unittest lab/measure/test_evidence.py
  # The same for the Rust crate: rust-analyzer's SCIP index read by lab/extractor/scipdeps, against per-test LLVM coverage.
  graph-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: lab/extractor/scipdeps/go.sum
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools,rust-analyzer
      - run: lab/measure/run_rust.sh "$RUNNER_TEMP/lab-out"
        env:
          CIC_FORMS_ROOT: ${{ github.workspace }}
      - run: MERKLE_GRAPH="$RUNNER_TEMP/lab-out/rtyped.json" python3 -m unittest lab/measure/test_merkle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: graph-measurement-rust
          path: |
            ${{ runner.temp }}/lab-out/*.json
  # Data edges: which files each test reads (strace), checked by corrupting data files, with a planted defect.
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            go/go.sum
            lab/extractor/typeddeps/go.sum
            lab/extractor/scipdeps/go.sum
      - run: sudo apt-get install -y strace
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-analyzer
      - run: lab/measure/run_data.sh "$RUNNER_TEMP/lab-out"
        env:
          CIC_FORMS_ROOT: ${{ github.workspace }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: data-edges
          path: |
            ${{ runner.temp }}/lab-out/data*.json

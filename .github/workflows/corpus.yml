name: corpus
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: make corpus
      - run: make coverage
      - run: make grammar-selftest
      # Mandatory, unconditional: the declared grammar identity must reproduce from the real
      # upstream bytes. A failed download, a missing file or a different commit is red.
      - id: grammar_pin
        run: echo "commit=$(python3 tools/grammar_identity.py commit --pins corpus/pins.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CentralInfraCore/cic-primitives
          ref: ${{ steps.grammar_pin.outputs.commit }}
          path: upstream/cic-primitives
      - run: python3 tools/grammar_identity.py verify --pins corpus/pins.yaml --repo upstream/cic-primitives

name: p1
# The P1 implementation (rust/, go/): format, lint, tests with the shared corpus, and the
# mandatory branch coverage gate of ADR 0009 on product code, measured with the pinned
# gobranch and rustbranch (coverage/tools.yaml).
on:
  workflow_dispatch:
  workflow_call:   # the nightly FULL on main (nightly.yml) runs this very gate
    inputs:
      full:
        description: "run the full mode even when the caller event is a push (the FULL after a change of this workflow)"
        type: boolean
        default: false
  push:
    branches: ["main"]
  pull_request:   # every pull request (#97): its checks are required by the ruleset of main, and a change with no product code is a cheap diff
permissions:
  contents: read
env:
  # The Rust toolchain of the whole gate, pinned (#94): a new stable release must not turn `clippy -D warnings` red without a change of
  # the code. Raise it on purpose, in a pull request of its own; the cached tools are keyed by the compiler that built them.
  RUST_TOOLCHAIN: "1.99.1"
  # The pull request's full run measures with cargo-gamma and go-mutants (docs/FAST-FULL.md); the nightly FULL keeps cargo-mutants and go-mutesting.
  # cargo-gamma runs every mutator family except the three that took 70% of a whole-tree run and found no survivor in it (literal, stmt, loop): the code
  # that exists is covered for them, and the diff mode still runs every family on the code a pull request changes.
  GAMMA_MUTATORS: "all,!literal,!stmt,!loop"
  GAMMA_SHARDS: "6"
  GOMUTANTS_SHARDS: "3"
jobs:
  # Is this push the tree of a pull request head that was already checked? Then the checks of a push would repeat themselves (tools/inherited_tree.py,
  # .github/workflows/inherit.yml). The jobs that a push runs wait for this one; a skipped or failed answer is "no", and they run.
  inherit:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/inherit.yml
    with:
      caller: p1
      workflows: p1.yml,corpus.yml
    permissions:
      contents: read
  quality-gate-selftest:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 tools/quality_gate.py selftest
      - run: python3 -W error::ResourceWarning -m unittest tools/test_shard_plan.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_cached_tool.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_diff_gate.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_shard_count.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_fuzz_matrix.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_seeded_select.py
      - run: python3 -W error::ResourceWarning -m unittest tools/test_nightly_last_full.py
      - run: pip install -r tools/requirements.txt
      - run: python3 -W error::ResourceWarning -m unittest tools/p5/test_engine_vectors.py
      - run: python3 -W error::ResourceWarning -m unittest tools/parity/test_gen_canonical.py
      - run: python3 -W error::ResourceWarning -m unittest tools/parity/test_gen_materialize.py
      - run: python3 tools/p5/engine_vectors.py --own
      - run: python3 -W error::ResourceWarning -m unittest tools/p5/test_materialize_cases.py
  # The test evidence tools (docs/TEST-EVIDENCE.md): unit tests and probes, the Go implementation of the canonical JSON on
  # the shared vectors, the seeded defects of the verifier, and that `gh attestation verify` has the flags the verifier uses.
  evidence-selftest:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/test-evidence/evidence.py pins
      - run: python3 tools/test-evidence/evidence.py selftest
      # the 97 defects in 4 processes side by side on the runner's cores (#98): one job, the same required check name
      - run: python3 tools/test-evidence/seeded.py --parallel 4
      - run: CIC_REQUIRE_GH_ATTESTATION=1 python3 tools/test-evidence/evidence.py check-gh
  rust:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - run: cargo +"$RUST_TOOLCHAIN" fmt --check
        working-directory: rust
      - run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
        working-directory: rust
      - run: cargo +"$RUST_TOOLCHAIN" test --locked
        working-directory: rust
      # P5-1 (ADR 0014, decision A): the canonical-bytes table is the engine's own vectors at the pinned commit, plus own vectors against a reference written apart
      - id: engine
        run: echo "commit=$(sed -n 's/^commit //p' testdata/p5/engine-pin.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CentralInfraCore/cic-primitive-engine
          ref: ${{ steps.engine.outputs.commit }}
          path: upstream/cic-primitive-engine
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/p5/engine_vectors.py --engine upstream/cic-primitive-engine
      # P5-3: the schema identity vectors the tests read are a snapshot of the engine's own (D1.3, cic-primitive-engine PR #64); byte for byte, the sources included
      - run: diff -r upstream/cic-primitive-engine/conformance/differential/schema_identity testdata/p5/schema_identity
      # P5-2 (ADR 0014, decision A): the engine's own MaterializedObject::try_new and materialized_object_digest on the shared flat-materialization cases,
      # whose expected values are computed by the script (a third reader), and the script's file is the one that is committed
      - run: python3 tools/p5/materialize_cases.py
      - run: cargo +"$RUST_TOOLCHAIN" run --locked -q --manifest-path tools/p5/engine-harness-rust/Cargo.toml -- .
  go:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - run: test -z "$(gofmt -l .)"
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test -race -count=1 -rapid.checks=1000 ./...
        working-directory: go
      # P5-2: the same cases against the engine's Go module (the Rust peer is in the rust job)
      - id: engine
        run: echo "commit=$(sed -n 's/^commit //p' testdata/p5/engine-pin.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CentralInfraCore/cic-primitive-engine
          ref: ${{ steps.engine.outputs.commit }}
          path: upstream/cic-primitive-engine
      - run: go run . ../../..
        working-directory: tools/p5/engine-harness-go
      # the go-mutesting executors give a mutant the verdict its test run earns: one that does not build is not killed (#94)
      - run: python3 -W error::ResourceWarning -m unittest tools/test_mutation_exec.py
  branch-coverage:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-10-17 --profile minimal --component llvm-tools-preview
          rustup default nightly-2026-10-17
          rustc --version
      - name: Build the pinned measurement tools
        run: |
          mkdir -p "$RUNNER_TEMP/bc"
          (cd tools/branchcov/go && go build -o "$RUNNER_TEMP/bc/gobranch" ./cmd/gobranch)
          (cd tools/branchcov/rust && CARGO_TARGET_DIR="$RUNNER_TEMP/bc/rt" cargo build --release --locked)
      - name: Measure, report and gate
        env:
          CIC_FORMS_ROOT: ${{ github.workspace }}
        run: |
          set -e
          BC="$RUNNER_TEMP/bc"
          COMMIT=$(git rev-parse HEAD)
          (cd go && "$BC/gobranch" run -C . -o "$BC/go-run.json")
          CARGO_TARGET_DIR="$BC/rust-sample" "$BC/rt/release/rustbranch" run --dir rust --out "$BC/rust-run.json"
          for l in go rust; do
            python3 tools/branchcov/adapter.py $l --run "$BC/$l-run.json" --root . --module-dir $l \
              --scope coverage/scope.yaml --commit "$COMMIT" --out "$BC/$l-report.json"
          done
          python3 tools/coverage_gate.py check --root . --scope coverage/scope.yaml --tools coverage/tools.yaml \
            --commit "$COMMIT" --report rust="$BC/rust-report.json" --report go="$BC/go-report.json"
      # The reports the gate read: the evidence builder takes the branch counts from them (docs/EVIDENCE-PRODUCTION.md).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: branch-reports
          path: |
            ${{ runner.temp }}/bc/rust-report.json
            ${{ runner.temp }}/bc/go-report.json
          if-no-files-found: warn
      # A gate that cannot fail proves nothing: with almost all tests dropped (Rust: only the
      # behaviour tests; Go: one test) the same gate must be red on product code, for both languages.
      - name: Seeded proof, the gate turns red on product code
        env:
          CIC_FORMS_ROOT: ${{ github.workspace }}
        run: |
          BC="$RUNNER_TEMP/bc"
          COMMIT=$(git rev-parse HEAD)
          (cd go && GOFLAGS='-run=^TestTheDefaultLimitsAreThePublishedOnes$' "$BC/gobranch" run -C . -o "$BC/go-reduced.json")
          CARGO_TARGET_DIR="$BC/rust-sample" "$BC/rt/release/rustbranch" run --dir rust --out "$BC/rust-reduced.json" -- --test behaviour
          for l in go rust; do
            python3 tools/branchcov/adapter.py $l --run "$BC/$l-reduced.json" --root . --module-dir $l \
              --scope coverage/scope.yaml --commit "$COMMIT" --out "$BC/$l-reduced-report.json"
          done
          set +e
          OUT=$(python3 tools/coverage_gate.py check --root . --scope coverage/scope.yaml --tools coverage/tools.yaml \
            --commit "$COMMIT" --report rust="$BC/rust-reduced-report.json" --report go="$BC/go-reduced-report.json")
          RC=$?
          echo "$OUT"
          test "$RC" -eq 1
          echo "$OUT" | grep -q "FAIL rust BELOW_THRESHOLD"
          echo "$OUT" | grep -q "FAIL go BELOW_THRESHOLD"

  # PHASES.md quality gates, on the product code of rust/ and go/: line coverage and mutation score
  # strictly above 90% in both languages. Property tests run with the unit tests above; the
  # parser fuzz targets are in the `fuzz` job. The measurements run in parallel, the mutation ones in
  # shards (the same mutants, split; the gate checks that every mutant was tested by exactly one shard
  # and that no shard is missing), and the job named `quality` decides. It is followed by a seeded proof
  # that the same gate turns red when the tests are weakened.
  # The scope of the mutation measurement (docs/DELTA-DIFF-GATE.md). On a pull request: `diff`, the mutants of the lines the change
  # touches, or `full`, when the change could weaken what the unchanged code is protected by (a modified or removed test line, a
  # change of how the gate measures: tools/diff_gate.py says which and why). On a push to main: `light`, only the cheap checks (the
  # unit tests, the corpus, the coverage, the parity), no mutation and no fuzz: main is measured by the nightly FULL (docs/DELTA-DIFF-GATE.md,
  # section 4.1). On every other event (the nightly FULL, by hand): `full`.
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.s.outputs.mode }}
      engine: ${{ steps.s.outputs.engine }}
      seeded_shards: ${{ steps.s.outputs.seeded_shards }}
      seeded_n: ${{ steps.s.outputs.seeded_n }}
      fuzz_matrix: ${{ steps.s.outputs.fuzz_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # #92: when the only thing that keeps a pull request full is a change inside existing test functions, the base versions of those
      # tests run with line coverage and the lines they executed join the diff (diff_gate.py --measure). The toolchains are set up only then.
      - id: w
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -e
          python3 tools/diff_gate.py scope --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/scope0" --root . > /dev/null
          python3 - "$RUNNER_TEMP/scope0/scope.json" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          import tools.diff_gate as d
          v = json.load(open(sys.argv[1]))
          only = v["reasons"] == [d.PENDING]
          print("go=%s" % str(only and bool(v["widen"].get("go"))).lower())
          print("rust=%s" % str(only and bool(v["widen"].get("rust"))).lower())
          EOF
      - uses: ./.github/actions/upstream-pinned
        if: ${{ steps.w.outputs.go == 'true' || steps.w.outputs.rust == 'true' }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: ${{ steps.w.outputs.go == 'true' }}
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Rust toolchain, for the coverage of the changed tests
        if: ${{ steps.w.outputs.rust == 'true' }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Tool, cargo-llvm-cov (pinned)
        if: ${{ steps.w.outputs.rust == 'true' }}
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-llvm-cov
          spec: cargo-llvm-cov@0.9.1
      - id: s
        env:
          EVENT: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full }}
          MEASURE: ${{ steps.w.outputs.go == 'true' || steps.w.outputs.rust == 'true' }}
        run: |
          set -e
          S="$RUNNER_TEMP/scope"
          mkdir -p "$S"
          rr=0; gr=0; changed=""
          if [ "$EVENT" = "pull_request" ]; then
            # the merge candidate: its first parent is the target branch, the difference is exactly what the pull request changes
            measure=""; [ "$MEASURE" = true ] && measure=--measure
            python3 tools/diff_gate.py scope --base HEAD^1 --head HEAD --out "$S" --root . $measure | tee "$S/report.txt"
            mode=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' "$S/scope.json")
            rr=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["rust_ranges"])' "$S/scope.json")
            gr=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["go_ranges"])' "$S/scope.json")
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            mode=full
            [ "$EVENT" = "push" ] && [ "$FORCE_FULL" != "true" ] && mode=light
            printf '{"mode": "%s", "reasons": ["not a pull request (%s)"], "notes": []}\n' "$mode" "$EVENT" > "$S/scope.json"
            : > "$S/rust.patch"
            echo '{}' > "$S/diff-lines.json"
            echo "mode=$mode (event: $EVENT)" > "$S/report.txt"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # who measures the mutants of a full run: the pull request's full run uses the fast tools (cargo-gamma, go-mutants), everything else
          # (the nightly FULL, a run by hand, the FULL after a change of this workflow) the full set of the classic ones (docs/FAST-FULL.md)
          engine=classic
          [ "$mode" = full ] && [ "$EVENT" = pull_request ] && engine=fast
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          # the seeded defects (tools/seeded_defects.py --shard K/N): a full run cuts them into shards, because one serial job took 33 minutes of the 40 it is allowed and
          # every pull request that adds defects makes it longer; a diff runs only the defects of the files it changes, in one. The list of shards and their count are
          # written together here, and nowhere else.
          if [ "$mode" = full ]; then seeded='[0,1,2,3,4,5,6,7]'; seeded_n=8; else seeded='[0]'; seeded_n=1; fi
          echo "seeded_shards=$seeded" >> "$GITHUB_OUTPUT"
          echo "seeded_n=$seeded_n" >> "$GITHUB_OUTPUT"
          # the fuzz targets this run needs (tools/fuzz_matrix.py): all of them in full, none on a push, in a diff those of the language the diff touches
          python3 tools/fuzz_matrix.py --mode "$mode" --rust-ranges "$rr" --go-ranges "$gr" --changed $changed --github-output "$GITHUB_OUTPUT" | tee -a "$S/report.txt"
          { echo "### Mutation scope: $mode"; echo; echo '```'; cat "$S/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
          if-no-files-found: error

  quality-lines:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Tool, cargo-llvm-cov (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-llvm-cov
          spec: cargo-llvm-cov@0.9.1
      - name: Line coverage
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" llvm-cov --locked --json --summary-only --output-path "$RUNNER_TEMP/q/rust-lines.json")
          (cd go && go test -count=1 -covermode=set -coverprofile="$RUNNER_TEMP/q/go-lines.out" ./...)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lines
          path: |
            ${{ runner.temp }}/q/rust-lines.json
            ${{ runner.temp }}/q/go-lines.out
          if-no-files-found: error
      # The part of the execution environment this job is responsible for (docs/EVIDENCE-PRODUCTION.md). Evidence is
      # gathered on the side: if this fails the measurement and its gate are not affected, and there is no record.
      - name: Environment for the evidence record
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/env"
          python3 tools/test-evidence/evidence.py env --fields rustc,cargo,python,tool:cargo-llvm-cov,runner --toolchain "$RUST_TOOLCHAIN" --out "$RUNNER_TEMP/env/env.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: env-quality-lines
          path: ${{ runner.temp }}/env/env.json
          if-no-files-found: warn

  # How many shards the full mutation is cut into (docs/DELTA-DIFF-GATE.md, 9.2): at most about 100 mutants and about ten minutes per shard,
  # whichever bound is reached first (tools/shard_count.py, tools/shard_budget.json). Computed from the mutants listed now, so the count is
  # one value that the matrix, the Rust dealing and the Go `k/n` all read; the gate still requires every mutant in exactly one shard.
  plan:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rust_n: ${{ steps.c.outputs.rust_n }}
      rust_shards: ${{ steps.c.outputs.rust_shards }}
      go_n: ${{ steps.c.outputs.go_n }}
      go_shards: ${{ steps.c.outputs.go_shards }}
      go_mutants: ${{ steps.c.outputs.go_mutants }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-mutants
          spec: cargo-mutants@27.1.0
      - name: Tool, go-mutesting (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutesting
          spec: github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20261002081621-9ce5f731e321
      - id: c
        run: |
          set -e
          rust=$(cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          # every Go mutant, listed by running the executor that kills nothing and costs nothing: `true` answers every mutant at once
          go=$(cd go && go-mutesting --exec /bin/true ./... 2>/dev/null | grep -c '^PASS ' || true)
          echo "listed: rust $rust, go $go"
          test "$rust" -gt 0 && test "$go" -gt 0   # a listing that found nothing must not turn into one empty shard
          echo "go_mutants=$go" >> "$GITHUB_OUTPUT"   # the gate checks the shards' verdicts against it (#94)
          python3 tools/shard_count.py --lang rust --mutants "$rust" --github-output "$GITHUB_OUTPUT"
          python3 tools/shard_count.py --lang go --mutants "$go" --github-output "$GITHUB_OUTPUT"

  quality-mutation-rust:
    needs: [scope, plan]
    if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.rust_shards) }}
    env:
      RUST_SHARDS: ${{ needs.plan.outputs.rust_n }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-mutants
          spec: cargo-mutants@27.1.0
      # Who runs which mutants is dealt by measured cost (tools/shard_plan.py, docs/QUALITY-SHARDING.md). It changes nothing about
      # what is run: the timeout, the tests and the mutants are the same, and the gate still wants every listed mutant in exactly
      # one shard's report. The shard stops before it runs if the regex does not select exactly the planned mutants.
      - name: The mutants of this shard
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          (cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json) > "$RUNNER_TEMP/q/all.json"
          python3 tools/shard_plan.py select --list "$RUNNER_TEMP/q/all.json" --costs tools/mutation-costs.json \
            --shards "$RUST_SHARDS" --shard ${{ matrix.shard }} --regex-out "$RUNNER_TEMP/q/re.txt" --names-out "$RUNNER_TEMP/q/names.json"
          (cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json -F "$(cat "$RUNNER_TEMP/q/re.txt")") > "$RUNNER_TEMP/q/selected.json"
          python3 tools/shard_plan.py verify --names "$RUNNER_TEMP/q/names.json" --selected "$RUNNER_TEMP/q/selected.json"
      - name: Mutation, Rust (cargo-mutants), one shard
        run: |
          # The exit status of cargo-mutants says whether mutants survived; the gate decides that.
          # The cap is the one of the diff shards (diff-mutation-rust): a mutant that moves the reader backwards can grow memory until the runner kills the whole job
          # ("The operation was canceled", no verdict; FULL 40841623917, shards 10 and 11); under the cap the allocation fails and the mutant is caught.
          (ulimit -v 6291456; cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" mutants -F "$(cat "$RUNNER_TEMP/q/re.txt")" --output "$RUNNER_TEMP/q/mut-rust" --jobs 1 --timeout 120 -- --tests) || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/mut-rust/mutants.out/outcomes.json
          if-no-files-found: error
      # the per-mutant log, also when the shard is cancelled: it says which mutant was running
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: rust-mutants-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/mut-rust
          if-no-files-found: ignore
      # The part of the execution environment this job is responsible for (docs/EVIDENCE-PRODUCTION.md). Evidence is
      # gathered on the side: if this fails the measurement and its gate are not affected, and there is no record.
      - name: Environment for the evidence record
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/env"
          python3 tools/test-evidence/evidence.py env --fields rustc,cargo,python,tool:cargo-mutants,runner --toolchain "$RUST_TOOLCHAIN" --out "$RUNNER_TEMP/env/env.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: env-rust-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/env/env.json
          if-no-files-found: warn

  quality-mutation-go:
    needs: [scope, plan]
    if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.go_shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Tool, go-mutesting (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutesting
          spec: github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20261002081621-9ce5f731e321
      - name: Mutation, Go (go-mutesting), one shard
        env:
          GO_N: ${{ needs.plan.outputs.go_n }}
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          export CIC_MUTATION_SHARD="${{ matrix.shard }}/$GO_N" CIC_MUTATION_LEDGER="$RUNNER_TEMP/q/ledger"
          : > "$CIC_MUTATION_LEDGER"
          (cd go && go-mutesting --exec "$GITHUB_WORKSPACE/tools/mutation_shard_exec.sh" ./... > "$RUNNER_TEMP/q/mut-go.txt") || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-ledger-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/ledger
          if-no-files-found: error
      # The part of the execution environment this job is responsible for (docs/EVIDENCE-PRODUCTION.md). Evidence is
      # gathered on the side: if this fails the measurement and its gate are not affected, and there is no record.
      - name: Environment for the evidence record
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/env"
          python3 tools/test-evidence/evidence.py env --fields go,python,tool:go-mutesting,runner --out "$RUNNER_TEMP/env/env.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: env-go-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/env/env.json
          if-no-files-found: warn

  # The diff gate (docs/DELTA-DIFF-GATE.md): only the mutants in the lines of the pull request. One job per language, no shards (a diff
  # is small). The timeout per mutant is the same as in the full run, the threshold is the same one; `quality` judges.
  # The diff is sharded like the full run (#92): the mutants of the diff are counted, tools/shard_count.py cuts them with the same budget,
  # and the Rust list is the one the shards are dealt from and checked against.
  diff-plan:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'diff' || needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      rust_mutants: ${{ steps.c.outputs.rust_mutants }}
      rust_n: ${{ steps.c.outputs.rust_n }}
      rust_shards: ${{ steps.c.outputs.rust_shards }}
      go_n: ${{ steps.c.outputs.go_n }}
      go_shards: ${{ steps.c.outputs.go_shards }}
      go_mutants: ${{ steps.c.outputs.go_mutants }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-mutants
          spec: cargo-mutants@27.1.0
      - name: Tool, go-mutesting (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutesting
          spec: github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20261002081621-9ce5f731e321
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
      - id: c
        run: |
          set -e
          S="$RUNNER_TEMP/scope"
          mkdir -p "$RUNNER_TEMP/dp"
          # Fail closed: a listing that failed is not "no mutants in the diff". A diff with no Rust code has nothing to list (cargo-mutants prints nothing for an empty
          # diff, so the list is written here); a diff with Rust code must give a JSON list, of any length, from a listing that succeeded (set -e).
          if [ -s "$S/rust.patch" ]; then
            (cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json --in-diff "$S/rust.patch") > "$RUNNER_TEMP/dp/rust-listed.json"
          else
            echo '[]' > "$RUNNER_TEMP/dp/rust-listed.json"
          fi
          rust=$(python3 -c 'import json,sys; d = json.load(open(sys.argv[1])); assert isinstance(d, list); print(len(d))' "$RUNNER_TEMP/dp/rust-listed.json")
          # the Go mutants of the diff, counted by the diff executor in its list mode: no test runs
          files=$(python3 -c 'import json,sys; print(" ".join(p[len("go/"):] for p in json.load(open(sys.argv[1]))))' "$S/diff-lines.json")
          go=0
          if [ -n "$files" ]; then
            # The exit status of go-mutesting is not the answer; its output is, and tools/go_list_count.py believes a count (zero included) only from a run that finished
            # with its summary line and had no mutant the executor could not place.
            (cd go && CIC_MUTATION_LIST_ONLY=1 CIC_MUTATION_SHARD=0/1 CIC_MUTATION_LEDGER=/dev/null CIC_DIFF_LINES="$S/diff-lines.json" CIC_REPO_ROOT="$GITHUB_WORKSPACE" \
              go-mutesting --exec "$GITHUB_WORKSPACE/tools/mutation_diff_exec.sh" $files) > "$RUNNER_TEMP/dp/go-list.out" 2>&1 || true
            go=$(python3 tools/go_list_count.py "$RUNNER_TEMP/dp/go-list.out")
          fi
          echo "mutants in the diff: rust $rust, go $go"
          echo "rust_mutants=$rust" >> "$GITHUB_OUTPUT"
          echo "go_mutants=$go" >> "$GITHUB_OUTPUT"
          python3 tools/shard_count.py --lang rust --mutants "$rust" --github-output "$GITHUB_OUTPUT"
          python3 tools/shard_count.py --lang go --mutants "$go" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-diff-listed
          path: ${{ runner.temp }}/dp/rust-listed.json
          if-no-files-found: error

  diff-mutation-rust:
    needs: [scope, diff-plan]
    if: ${{ needs.scope.outputs.mode == 'diff' || needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.diff-plan.outputs.rust_shards) }}
    env:
      RUST_SHARDS: ${{ needs.diff-plan.outputs.rust_n }}
      RUST_MUTANTS: ${{ needs.diff-plan.outputs.rust_mutants }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-mutants
          spec: cargo-mutants@27.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rust-diff-listed
          path: ${{ runner.temp }}/listed
      - name: Mutation, Rust (cargo-mutants), one shard of the mutants in the diff
        run: |
          set -e
          Q="$RUNNER_TEMP/q"
          mkdir -p "$Q/out"
          echo "mutants in the diff: $RUST_MUTANTS, shard ${{ matrix.shard }} of $RUST_SHARDS"
          if [ "$RUST_MUTANTS" = 0 ]; then
            echo '{"caught": 0, "missed": 0, "timeout": 0, "unviable": 0, "total_mutants": 0, "outcomes": []}' > "$Q/out/outcomes.json"
          else
            # dealt by measured cost as in the full run; verify stops the shard if the regex selects other mutants than planned
            python3 tools/shard_plan.py select --list "$RUNNER_TEMP/listed/rust-listed.json" --costs tools/mutation-costs.json \
              --shards "$RUST_SHARDS" --shard ${{ matrix.shard }} --regex-out "$Q/re.txt" --names-out "$Q/names.json"
            (cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json --in-diff "$RUNNER_TEMP/scope/rust.patch" -F "$(cat "$Q/re.txt")") > "$Q/selected.json"
            python3 tools/shard_plan.py verify --names "$Q/names.json" --selected "$Q/selected.json"
            # The exit status of cargo-mutants says whether mutants survived; the gate decides that.
            # A mutant that moves the reader backwards can grow memory until the runner kills the whole job ("The operation was canceled", no verdict): the cap turns
            # that into a failed allocation, so the mutant is caught and the shard ends. 6 GB of address space is what the build and the tests of the whole diff need (measured locally).
            (ulimit -v 6291456; cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" mutants --in-diff "$RUNNER_TEMP/scope/rust.patch" -F "$(cat "$Q/re.txt")" \
              --output "$Q/mut-rust" --jobs 1 --timeout 120 -- --tests) || true
            cp "$Q/mut-rust/mutants.out/outcomes.json" "$Q/out/outcomes.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-diff-mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/out
          if-no-files-found: error
      # the per-mutant log, also when the shard is cancelled: it says which mutant was running
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: rust-diff-mutants-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/mut-rust
          if-no-files-found: ignore

  diff-mutation-go:
    needs: [scope, diff-plan]
    if: ${{ needs.scope.outputs.mode == 'diff' || needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.diff-plan.outputs.go_shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Tool, go-mutesting (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutesting
          spec: github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20261002081621-9ce5f731e321
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
      - name: Mutation, Go (go-mutesting), one shard of the mutants in the diff
        env:
          GO_N: ${{ needs.diff-plan.outputs.go_n }}
        run: |
          set -e
          Q="$RUNNER_TEMP/q"
          mkdir -p "$Q/out"
          : > "$Q/out/ledger"
          # the product files the diff touches (the keys of diff-lines.json, relative to go/); none means no Go mutants: an empty ledger
          files=$(python3 -c 'import json,sys; print(" ".join(p[len("go/"):] for p in json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/scope/diff-lines.json")
          echo "Go files in the diff: ${files:-none}"
          if [ -n "$files" ]; then
            export CIC_MUTATION_SHARD="${{ matrix.shard }}/$GO_N" CIC_MUTATION_LEDGER="$Q/out/ledger" CIC_DIFF_LINES="$RUNNER_TEMP/scope/diff-lines.json" CIC_REPO_ROOT="$GITHUB_WORKSPACE"
            (cd go && go-mutesting --exec "$GITHUB_WORKSPACE/tools/mutation_diff_exec.sh" $files > "$Q/mut-go.txt") || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-diff-ledger-${{ matrix.shard }}
          path: ${{ runner.temp }}/q/out
          if-no-files-found: error

  # A pull request in diff mode: cargo-gamma runs beside cargo-mutants on the lines of the diff, with EVERY mutator family (the new code is where the weak spots of
  # a suite show: the families that find nothing in the whole tree found survivors in the diff of #107). A shadow for now: it gates nothing, its survivors are
  # in the summary of the run and in the artifact (docs/FAST-FULL.md).
  diff-gamma:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'diff' || needs.scope.outputs.engine == 'fast' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-gamma (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-gamma
          spec: cargo-gamma@0.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
      - name: Mutation, Rust (cargo-gamma, every family), the lines of the diff
        run: |
          mkdir -p "$RUNNER_TEMP/diffgamma"
          if [ -s "$RUNNER_TEMP/scope/rust.patch" ]; then
            (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" gamma run --in-diff "$RUNNER_TEMP/scope/rust.patch" --mutators all \
              --jobs 4 --artifact-dir "$RUNNER_TEMP/diffgamma")
          else
            echo "no Rust code in the diff"
          fi
      - name: What it found
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/diffgamma/gamma-report.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, os, sys
          print("### cargo-gamma on the diff (every family, a shadow: it gates nothing)")
          if not os.path.exists(sys.argv[1]):
              print("\nno report (no Rust code in the diff, or the run could not measure)")
              sys.exit(0)
          counts, undetected = {}, []
          for path, f in json.load(open(sys.argv[1]))["files"].items():
              for m in f["mutants"]:
                  counts[m["status"]] = counts.get(m["status"], 0) + 1
                  if m["status"] == "Survived":
                      undetected.append("%s:%d  %s  [%s] %s" % (path, m["location"]["start"]["line"], m["description"], m["mutatorName"], m.get("statusReason", "")))
          print("\n" + ", ".join("%s %d" % kv for kv in sorted(counts.items())))
          if undetected:
              print("\nNot detected (survived, timed out, or stopped by the memory limit):\n\n```")
              print("\n".join(undetected))
              print("```")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diff-gamma-report
          path: ${{ runner.temp }}/diffgamma/gamma-report.json
          if-no-files-found: ignore

  # ---- the pull request's full run: cargo-gamma and go-mutants (docs/FAST-FULL.md) --------------------------------------------------------------
  # Both tools build the mutants once and switch them per test process, and both shard by the content of the mutant, so a shard is the same slice on every run.
  # The gate (tools/quality_gate.py, --gamma-reports and --gomutants-reports) wants every listed mutant measured by exactly one shard, as for the classic tools.
  # Only a pull request in full mode runs these; the nightly FULL and a run by hand take the classic jobs above.
  fast-list:
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-gamma (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-gamma
          spec: cargo-gamma@0.3.0
      - name: The mutants there are
        run: |
          mkdir -p "$RUNNER_TEMP/fast"
          (cd rust && cargo +"$RUST_TOOLCHAIN" gamma list mutants --mutators "$GAMMA_MUTATORS" --json) > "$RUNNER_TEMP/fast/gamma-listed.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-gamma-listed
          path: ${{ runner.temp }}/fast/gamma-listed.json
          if-no-files-found: error

  fast-mutation-rust:
    needs: [scope, fast-list]
    if: ${{ needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]   # GAMMA_SHARDS above; the gate fails if a shard is missing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-gamma (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-gamma
          spec: cargo-gamma@0.3.0
      - name: Mutation, Rust (cargo-gamma), one shard
        run: |
          # A run that cannot measure (the unmutated suite is red) exits non-zero and writes no report; survivors do not change the exit status, the gate decides.
          mkdir -p "$RUNNER_TEMP/fast"
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" gamma run --mutators "$GAMMA_MUTATORS" \
            --shard-count "$GAMMA_SHARDS" --shard-index ${{ matrix.shard }} --jobs 4 --artifact-dir "$RUNNER_TEMP/fast/gamma")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gamma-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/fast/gamma/gamma-report.json
          if-no-files-found: error

  fast-mutation-go:
    needs: scope
    if: ${{ needs.scope.outputs.engine == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]   # GOMUTANTS_SHARDS above (go-mutants counts shards from 1)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum
      - name: Tool, go-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutants
          spec: github.com/P4suta/go-mutants/cmd/go-mutants@v0.0.0-20261021125843-e9c9682eed15
      - name: Mutation, Go (go-mutants), one shard
        run: |
          # The tests read ../corpus and ../testdata, so the snapshot go-mutants copies must be the repository root: a workspace file at the root names the module.
          go work init ./go
          go-mutants run --profile all --shard ${{ matrix.shard }}/"$GOMUTANTS_SHARDS" --jobs 4 --report json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gomutants-report-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          if-no-files-found: error

  # The nightly FULL measures with the classic tools (the quality jobs above). Beside them, cargo-gamma runs with every mutator family, as a SHADOW: it gates
  # nothing and its failure is not the FULL's, but its reports are kept, so that the families left out of the pull request's full run keep being counted.
  shadow-gamma:
    needs: scope
    if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-gamma (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-gamma
          spec: cargo-gamma@0.3.0
      - name: Mutation, Rust (cargo-gamma, every family), one shard
        run: |
          mkdir -p "$RUNNER_TEMP/shadow"
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" gamma run --mutators all \
            --shard-count 8 --shard-index ${{ matrix.shard }} --jobs 4 --artifact-dir "$RUNNER_TEMP/shadow")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shadow-gamma-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shadow/gamma-report.json
          if-no-files-found: warn

  quality:
    needs: [scope, plan, quality-lines, quality-mutation-rust, quality-mutation-go, diff-plan, diff-mutation-rust, diff-mutation-go, fast-list, fast-mutation-rust, fast-mutation-go]
    # Also when a shard job failed: the gate then finds its report missing and is red. A skipped job would
    # count as passed. Not on a push to main (`light`): the mutation is measured by the nightly FULL.
    if: ${{ always() && needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The measurements ran
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          LINES: ${{ needs.quality-lines.result }}
          PLAN: ${{ needs.plan.result }}
          DIFF_PLAN: ${{ needs.diff-plan.result }}
          FULL_RUST: ${{ needs.quality-mutation-rust.result }}
          FULL_GO: ${{ needs.quality-mutation-go.result }}
          DIFF_RUST: ${{ needs.diff-mutation-rust.result }}
          DIFF_GO: ${{ needs.diff-mutation-go.result }}
          ENGINE: ${{ needs.scope.outputs.engine }}
          FAST_LIST: ${{ needs.fast-list.result }}
          FAST_RUST: ${{ needs.fast-mutation-rust.result }}
          FAST_GO: ${{ needs.fast-mutation-go.result }}
        run: |
          # a job that was skipped counts as passed in a plain `needs`: only the jobs of the mode that was chosen may be skipped, the
          # ones of the mode that was chosen must have succeeded, and the other mode's must not have run at all
          test "$SCOPE" = success
          test "$LINES" = success
          # the pull request's full run is measured by the fast jobs and only by them; the classic full, and the diff, must not have run those
          fast_ran() { test "$FAST_LIST" = success && test "$FAST_RUST" = success && test "$FAST_GO" = success; }
          fast_not() { test "$FAST_LIST" = skipped && test "$FAST_RUST" = skipped && test "$FAST_GO" = skipped; }
          case "$MODE" in
            full)
              if [ "$ENGINE" = fast ]; then
                fast_ran && test "$PLAN" = skipped && test "$FULL_RUST" = skipped && test "$FULL_GO" = skipped && test "$DIFF_PLAN" = success && test "$DIFF_RUST" = success && test "$DIFF_GO" = success
              else
                fast_not && test "$PLAN" = success && test "$FULL_RUST" = success && test "$FULL_GO" = success && test "$DIFF_PLAN" = skipped && test "$DIFF_RUST" = skipped && test "$DIFF_GO" = skipped
              fi ;;
            diff) fast_not && test "$PLAN" = skipped && test "$DIFF_PLAN" = success && test "$DIFF_RUST" = success && test "$DIFF_GO" = success && test "$FULL_RUST" = skipped && test "$FULL_GO" = skipped ;;
            *) echo "unknown mode '$MODE'"; false ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Tool, cargo-llvm-cov (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-llvm-cov
          spec: cargo-llvm-cov@0.9.1
      - name: Tool, cargo-mutants (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-mutants
          spec: cargo-mutants@27.1.0
      - name: Tool, go-mutesting (pinned)
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutesting
          spec: github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20261002081621-9ce5f731e321
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/q/in
      - name: The mutants there are
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
        run: |
          mkdir -p "$RUNNER_TEMP/q"
          (cd rust && cargo +"$RUST_TOOLCHAIN" mutants --list --json > "$RUNNER_TEMP/q/rust-listed.json")
      # The evidence builder works the numbers out again from the raw reports; it needs the list the shards are checked against.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
        continue-on-error: true
        with:
          name: quality-listed
          path: ${{ runner.temp }}/q/rust-listed.json
          if-no-files-found: warn
      # In a diff, and in the pull request's full run too: the classic tools measure the lines the pull request changes, so that the evidence on changed code at merge
      # time is the one it always was; only the whole-tree measurement moves to the fast tools (docs/FAST-FULL.md).
      - name: Gate, the diff (docs/DELTA-DIFF-GATE.md, section 2)
        if: ${{ needs.scope.outputs.mode == 'diff' || needs.scope.outputs.engine == 'fast' }}
        env:
          GO_MUTANTS: ${{ needs.diff-plan.outputs.go_mutants }}
        run: |
          Q="$RUNNER_TEMP/q"
          python3 tools/quality_gate.py check --diff --rust-lines "$Q/in/lines/rust-lines.json" --go-lines "$Q/in/lines/go-lines.out" \
            --rust-mutants "$Q"/in/rust-diff-mutants-*/outcomes.json --rust-listed "$Q/in/rust-diff-listed/rust-listed.json" \
            --go-ledgers "$Q"/in/go-diff-ledger-*/ledger --go-expected "$GO_MUTANTS"
      - name: Gate
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
        env:
          GO_MUTANTS: ${{ needs.plan.outputs.go_mutants }}
        run: |
          Q="$RUNNER_TEMP/q"
          python3 tools/quality_gate.py check --rust-lines "$Q/in/lines/rust-lines.json" --go-lines "$Q/in/lines/go-lines.out" \
            --rust-mutants "$Q"/in/rust-mutants-*/outcomes.json --rust-listed "$Q/rust-listed.json" \
            --go-ledgers "$Q"/in/go-ledger-*/ledger --go-expected "$GO_MUTANTS"
      - name: Gate, the pull request's full run (cargo-gamma and go-mutants, docs/FAST-FULL.md)
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'fast' }}
        run: |
          Q="$RUNNER_TEMP/q"
          python3 tools/quality_gate.py check --rust-lines "$Q/in/lines/rust-lines.json" --go-lines "$Q/in/lines/go-lines.out" \
            --gamma-reports "$Q"/in/gamma-report-*/gamma-report.json --gamma-listed "$Q/in/fast-gamma-listed/gamma-listed.json" \
            --gomutants-reports "$Q"/in/gomutants-report-*/mutation.json
      # A gate that cannot fail proves nothing. With the tests weakened, the same gate is red.
      - name: Seeded proof, weakened tests turn the line coverage red
        if: ${{ needs.scope.outputs.mode == 'full' }}
        run: |
          Q="$RUNNER_TEMP/q"
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" llvm-cov --locked --json --summary-only --output-path "$Q/rust-lines-weak.json" --test subset)
          (cd go && go test -count=1 -covermode=set -coverprofile="$Q/go-lines-weak.out" -run '^TestParseReadsTheSupportedSubset$' ./...)
          if [ "${{ needs.scope.outputs.engine }}" = fast ]; then
            MUT=(--gamma-reports "$Q"/in/gamma-report-*/gamma-report.json --gamma-listed "$Q/in/fast-gamma-listed/gamma-listed.json" \
                 --gomutants-reports "$Q"/in/gomutants-report-*/mutation.json)
          else
            MUT=(--rust-mutants "$Q"/in/rust-mutants-*/outcomes.json --rust-listed "$Q/rust-listed.json" --go-ledgers "$Q"/in/go-ledger-*/ledger)
          fi
          set +e
          OUT=$(python3 tools/quality_gate.py check --rust-lines "$Q/rust-lines-weak.json" --go-lines "$Q/go-lines-weak.out" "${MUT[@]}")
          RC=$?
          echo "$OUT"
          test "$RC" -eq 1
          echo "$OUT" | grep -q "FAIL rust line coverage .*BELOW_THRESHOLD"
          echo "$OUT" | grep -q "FAIL go statement coverage .*BELOW_THRESHOLD"
      - name: Tool, cargo-gamma (pinned)
        if: ${{ needs.scope.outputs.engine == 'fast' }}
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-gamma
          spec: cargo-gamma@0.3.0
      - name: Tool, go-mutants (pinned)
        if: ${{ needs.scope.outputs.engine == 'fast' }}
        uses: ./.github/actions/cached-tool
        with:
          kind: go
          name: go-mutants
          spec: github.com/P4suta/go-mutants/cmd/go-mutants@v0.0.0-20261021125843-e9c9682eed15
      - name: Seeded proof, weakened tests turn the mutation score red (cargo-gamma and go-mutants)
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'fast' }}
        run: |
          Q="$RUNNER_TEMP/q"
          # The same proof for the fast tools: mutate only recognize.* and let only the tests that do not exercise it decide: every mutant is undetected.
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" gamma run --mutators "$GAMMA_MUTATORS" --file src/recognize.rs \
            --include-test subset --jobs 2 --artifact-dir "$Q/gamma-weak") || true
          # go-mutants runs the test binaries it built once, so a narrower `go test` command or -run flag does not weaken them: the tree is weakened instead. Only the
          # file with the test that does not exercise recognize.go stays; this is the last step of the job, nothing after it needs the other tests.
          keep=$(grep -l TestParseReadsTheSupportedSubset go/*_test.go | head -1)
          find go -name '*_test.go' ! -path "$keep" -delete
          go work init ./go
          go-mutants run --include go/recognize.go --profile all --jobs 2 --report json
          mkdir -p "$Q/gomutants-weak" && cp reports/mutation/mutation.json "$Q/gomutants-weak/mutation.json"
          rm -rf go.work go.work.sum reports
          set +e
          OUT=$(python3 tools/quality_gate.py check --rust-lines "$Q/in/lines/rust-lines.json" --go-lines "$Q/in/lines/go-lines.out" \
            --gamma-reports "$Q/gamma-weak/gamma-report.json" --gomutants-reports "$Q/gomutants-weak/mutation.json")
          RC=$?
          echo "$OUT"
          test "$RC" -eq 1
          echo "$OUT" | grep -q "FAIL rust mutation score .*BELOW_THRESHOLD"
          echo "$OUT" | grep -q "FAIL go mutation score .*BELOW_THRESHOLD"
      - name: Seeded proof, weakened tests turn the mutation score red
        if: ${{ needs.scope.outputs.mode == 'full' && needs.scope.outputs.engine == 'classic' }}
        run: |
          Q="$RUNNER_TEMP/q"
          # Mutate only recognize.* and run only tests that do not exercise it: every mutant survives.
          (cd rust && CIC_FORMS_ROOT="$GITHUB_WORKSPACE" cargo +"$RUST_TOOLCHAIN" mutants --file src/recognize.rs --output "$Q/mut-rust-weak" --jobs 1 --timeout 120 -- --test subset) || true
          (cd go && CIC_MUTATION_RUN='^TestParseReadsTheSupportedSubset$' go-mutesting --exec "$GITHUB_WORKSPACE/tools/mutation_reduced_exec.sh" recognize.go > "$Q/mut-go-weak.txt") || true
          set +e
          OUT=$(python3 tools/quality_gate.py check --rust-lines "$Q/in/lines/rust-lines.json" --go-lines "$Q/in/lines/go-lines.out" \
            --rust-mutants "$Q/mut-rust-weak/mutants.out/outcomes.json" --go-mutants "$Q/mut-go-weak.txt")
          RC=$?
          echo "$OUT"
          test "$RC" -eq 1
          echo "$OUT" | grep -q "FAIL rust mutation score .*BELOW_THRESHOLD"
          echo "$OUT" | grep -q "FAIL go mutation score .*BELOW_THRESHOLD"

  # Parser fuzzing (PHASES.md: from P1). Go: native fuzzing. Rust: cargo-fuzz on the pinned nightly. One job per target (docs/DELTA-DIFF-GATE.md, 9.2):
  # the matrix comes from tools/fuzz_matrix.py through `scope` - every target in a full run, none on a push to main, and in a diff the targets of the
  # language whose product code, fuzz targets or seed inputs the diff touches (or all, if the shared corpus changes). The job named `fuzz` joins them
  # and says "not run" when no target was needed: a language that did not run is never reported as passed.
  fuzz-target:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'light' && needs.scope.outputs.fuzz_matrix != '[]' }}
    name: fuzz-target (${{ matrix.target.lang }} ${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scope.outputs.fuzz_matrix) }}
    env:
      TARGET: ${{ matrix.target.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: ${{ matrix.target.lang == 'go' }}
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - name: Go, 60 seconds
        if: ${{ matrix.target.lang == 'go' }}
        run: |
          cd go
          go test -run '^$' -fuzz "^Fuzz${TARGET}\$" -fuzztime 60s ./...
      # The fuzz jobs can fail: a committed canary input is a failure when CIC_FUZZ_CANARY is set.
      - name: Seeded proof, the canary turns this Go target red
        if: ${{ matrix.target.lang == 'go' }}
        run: |
          set +e
          (cd go && CIC_FUZZ_CANARY=1 go test -run "^Fuzz${TARGET}\$" ./...)
          test $? -ne 0 || { echo "Go canary did not fail for $TARGET"; exit 1; }
      - name: Rust nightly, and the pinned toolchain that builds the cached cargo-fuzz
        if: ${{ matrix.target.lang == 'rust' }}
        run: |
          rustup toolchain install nightly-2026-10-17 --profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Tool, cargo-fuzz (pinned)
        if: ${{ matrix.target.lang == 'rust' }}
        uses: ./.github/actions/cached-tool
        with:
          kind: cargo
          name: cargo-fuzz
          spec: cargo-fuzz@0.13.2
      - name: Environment for the evidence record
        if: ${{ matrix.target.lang == 'rust' }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/env"
          python3 tools/test-evidence/evidence.py env --fields tool:cargo-fuzz,runner --toolchain nightly-2026-10-17 --out "$RUNNER_TEMP/env/env.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ matrix.target.lang == 'rust' }}
        continue-on-error: true
        with:
          name: env-fuzz-${{ matrix.target.name }}
          path: ${{ runner.temp }}/env/env.json
          if-no-files-found: warn
      - name: Rust, 60 seconds
        if: ${{ matrix.target.lang == 'rust' }}
        working-directory: rust
        run: cargo +nightly-2026-10-17 fuzz run "$TARGET" -- -max_total_time=60
      - name: Seeded proof, the canary turns this Rust target red
        if: ${{ matrix.target.lang == 'rust' }}
        run: |
          set +e
          (cd rust && CIC_FUZZ_CANARY=1 cargo +nightly-2026-10-17 fuzz run "$TARGET" fuzz/canary/CANARY)
          test $? -ne 0 || { echo "Rust canary did not fail for $TARGET"; exit 1; }
          (cd rust && cargo +nightly-2026-10-17 fuzz run "$TARGET" fuzz/canary/CANARY)
          test $? -eq 0 || { echo "the canary input must pass when the switch is off ($TARGET)"; exit 1; }

  fuzz:
    needs: [scope, fuzz-target]
    # Also when a target job failed or was skipped: this job is the one name that the required checks list.
    if: ${{ always() && needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          MATRIX: ${{ needs.scope.outputs.fuzz_matrix }}
          RESULT: ${{ needs.fuzz-target.result }}
          SCOPE: ${{ needs.scope.result }}
        run: |
          test "$SCOPE" = success
          case "$RESULT" in
            success) echo "fuzz: every target of the matrix passed: $MATRIX" ;;
            skipped) test "$MATRIX" = '[]' || { echo "the fuzz targets were needed ($MATRIX) and did not run"; exit 1; }
                     echo "fuzz: not run - no target is needed for this diff" ;;
            *) echo "a fuzz target failed ($RESULT)"; exit 1 ;;
          esac

  # Tests must be shown to fail on a wrong implementation, not only to pass on a right one: each
  # deliberate defect (a coerced 0, a silent default version, an unverified pin, a loose CertPattern, ...)
  # is applied to a copy and the suites must turn red.
  seeded-defects-shard:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.seeded_shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      # in a diff only the defects of the product files the diff changes (the others are reported "not run"); in a full run all of them
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.scope.outputs.mode == 'diff' }}
        with:
          name: diff-scope
          path: ${{ runner.temp }}/scope
      - env:
          MODE: ${{ needs.scope.outputs.mode }}
          SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.seeded_n }}
        run: |
          if [ "$MODE" = diff ]; then
            python3 tools/seeded_defects.py all --changed-from "$RUNNER_TEMP/scope/scope.json" --shard "$SHARD"
          else
            python3 tools/seeded_defects.py all --shard "$SHARD"
          fi

  # The one name the required checks list for the seeded defects: it passes only when every shard did. A shard that failed or never ran is red here, not skipped.
  seeded-defects:
    needs: [scope, seeded-defects-shard]
    if: ${{ always() && needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.seeded-defects-shard.result }}
          SCOPE: ${{ needs.scope.result }}
          SHARDS: ${{ needs.scope.outputs.seeded_shards }}
        run: |
          test "$SCOPE" = success
          test "$RESULT" = success || { echo "a shard of the seeded defects did not pass ($RESULT)"; exit 1; }
          echo "seeded defects: every shard passed: $SHARDS"

  # Rust against Go on the same 30 005 generated inputs (tools/parity): the complete outcome of `parse`
  # (tree and positions, contract violations, refusal) is compared. A divergence that is not in the
  # allow list of known open ones turns the job red; the shared regression corpus (parity.json) runs in
  # the `rust` and `go` jobs above.
  parity:
    needs: inherit
    if: ${{ !cancelled() && needs.inherit.outputs.inherited != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: Generate, dump with both parsers, compare
        run: |
          set -e
          P="$RUNNER_TEMP/parity"
          mkdir -p "$P"
          python3 tools/parity/gen_inputs.py "$P/in.hex" --count 30000 --upstream "$CIC_PRIMITIVES_ROOT"
          (cd rust && PARITY_IN="$P/in.hex" PARITY_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_dump)
          (cd go && PARITY_IN="$P/in.hex" PARITY_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpParseOutcomes$' .)
          python3 tools/parity/compare.py "$P/in.hex" "$P/rust.jsonl" "$P/go.jsonl" --show 5 --allow testdata/p1/parity-known.txt
          # A gate that cannot fail proves nothing: break the outputs in the ways that must turn it red.
          python3 tools/parity/selftest.py "$P/in.hex" "$P/rust.jsonl" "$P/go.jsonl" testdata/p1/parity-known.txt
      # The same for P3 (normalize and the policy resolution): 3000 generated schema/document/unknown combinations, fixed seed. Not only
      # that both pass the same written expectations, but that they answer alike for the same input.
      - name: P3 differential, generate, dump with both languages, compare
        run: |
          set -e
          P="$RUNNER_TEMP/parity-p3"
          mkdir -p "$P"
          python3 tools/parity/gen_p3.py "$P/in.jsonl" --count 3000
          (cd rust && PARITY_P3_IN="$P/in.jsonl" PARITY_P3_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_p3_dump)
          (cd go && PARITY_P3_IN="$P/in.jsonl" PARITY_P3_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpP3Outcomes$' .)
          python3 tools/parity/compare_p3.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_p3.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"
      # And for the edit of P3b (E4): 3000 generated documents, paths and values, fixed seed. The two languages must answer alike (the text byte for byte, the span, the
      # refusal), and the comparison checks the guarantees of ADR 0012 on its own (the untouched bytes, the style kept and the canonical spelling, the old tree with one
      # scalar replaced and the forms kept, the no-op, edit and back, the two orders of independent edits). Its self-test breaks the outputs in 22 ways that must turn it red.
      - name: Edit differential, generate, dump with both languages, compare, self-test
        run: |
          set -e
          P="$RUNNER_TEMP/parity-edit"
          mkdir -p "$P"
          python3 tools/parity/gen_edit.py "$P/in.jsonl" --count 3000
          (cd rust && PARITY_EDIT_IN="$P/in.jsonl" PARITY_EDIT_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_edit_dump)
          (cd go && PARITY_EDIT_IN="$P/in.jsonl" PARITY_EDIT_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpEditOutcomes$' .)
          python3 tools/parity/compare_edit.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_edit.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"

      # And for the diff of P4 (D3b): 3000 generated pairs of documents with a scope, fixed seed. The two languages and the model of tools/parity/diff_model.py must
      # answer alike (the canonical bytes, the refusals with their code, phase, location, path and operand), and the comparison checks the properties of ADR 0008 on its own
      # (stability under the order of lists and sets, A against A is empty, B to A is A to B turned round, the canonical writing, the injected faults). Its self-test
      # breaks the outputs in 21 ways that must turn it red.
      - name: Diff differential, generate, dump with both languages, compare, self-test
        run: |
          set -e
          P="$RUNNER_TEMP/parity-diff"
          mkdir -p "$P"
          python3 tools/parity/diff_model.py --selftest
          python3 tools/parity/gen_diff.py "$P/in.jsonl" --count 3000
          (cd rust && PARITY_DIFF_IN="$P/in.jsonl" PARITY_DIFF_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_diff_dump)
          (cd go && PARITY_DIFF_IN="$P/in.jsonl" PARITY_DIFF_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpDiffOutcomes$' .)
          python3 tools/parity/compare_diff.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_diff.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"

      # And for the patch of P4 (P4-3): 3000 generated documents (the text with its styles, line ends, wrappers and the scalars that cannot be replaced) and a B each, fixed seed.
      # The two languages and the model of tools/parity/diff_model.py must answer alike, and the comparison checks the promises of ADR 0013 on its own (an unsupported event
      # is named first, the text is A with the canonical tokens swapped in and nothing else, the diff of the result to B has no changes, a replay and a tampered previous
      # are a conflict, the empty diff gives A back, an invalid A is refused by its own phase). Its self-test breaks the outputs in 24 ways that must turn it red.
      - name: Patch differential, generate, dump with both languages, compare, self-test
        run: |
          set -e
          P="$RUNNER_TEMP/parity-patch"
          mkdir -p "$P"
          python3 tools/parity/gen_patch.py "$P/in.jsonl" --count 3000
          (cd rust && PARITY_PATCH_IN="$P/in.jsonl" PARITY_PATCH_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_patch_dump)
          (cd go && PARITY_PATCH_IN="$P/in.jsonl" PARITY_PATCH_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpPatchOutcomes$' .)
          python3 tools/parity/compare_patch.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_patch.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"

      # And for the reader of the canonical bytes of a diff (ReadDiff / read_diff, #107): 20 000 generated inputs, fixed seed: the corpus diffs, valid diffs composed from
      # their events, the same after one edit of the structure or of the writing (so that the reader meets the order, the repeated path, the empty change, the shape),
      # numbers, nesting past the depth, strings and bytes. The two readers must give the same reason and offset or the same diff written back, there is no list of known
      # differences, and the comparison checks the promises of the reader on its own and that every reason is reached. Its self-test breaks the dumps in 13 ways.
      - name: ReadDiff differential, generate, dump with both languages, compare, self-test
        run: |
          set -e
          P="$RUNNER_TEMP/parity-diffread"
          mkdir -p "$P"
          python3 tools/parity/gen_diffread.py "$P/in.jsonl" --count 20000
          (cd rust && PARITY_DIFFREAD_IN="$P/in.jsonl" PARITY_DIFFREAD_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_diffread_dump)
          (cd go && PARITY_DIFFREAD_IN="$P/in.jsonl" PARITY_DIFFREAD_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpDiffReadOutcomes$' .)
          python3 tools/parity/compare_diffread.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_diffread.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"

      # And for the canonical bytes of a processed value (P5-1): 20 000 generated values, fixed seed, each with the answer of a reference written apart from both languages
      # (tools/parity/gen_canonical.py, from engine section A). Both languages must answer as the reference and as each other, with no list of known differences; the
      # self-test breaks the dumps in 12 ways.
      - name: Canonical bytes differential, generate, dump with both languages, compare, self-test
        run: |
          set -e
          P="$RUNNER_TEMP/parity-canonical"
          mkdir -p "$P"
          python3 tools/parity/gen_canonical.py "$P/in.jsonl" --count 20000
          (cd rust && PARITY_CANONICAL_IN="$P/in.jsonl" PARITY_CANONICAL_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_canonical_dump)
          (cd go && PARITY_CANONICAL_IN="$P/in.jsonl" PARITY_CANONICAL_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpCanonicalOutcomes$' .)
          python3 tools/parity/compare_canonical.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_canonical.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"

      # And for the flat materialization (P5-2): 6 000 generated cases, fixed seed, each with the answer of a reference that is built from the case's own structure and
      # reads neither the schema nor the document text (tools/parity/gen_materialize.py). Both languages must answer as the reference and as each other, with no list of
      # known differences; the self-test breaks the dumps in 19 ways. Then the ENGINE is the third reader: for every accepted case it builds its own MaterializedObject
      # from what each language wrote, under the key set the generator declared, and its digest must be the one the language gave (engine harnesses, pinned commit).
      - id: engine
        run: echo "commit=$(sed -n 's/^commit //p' testdata/p5/engine-pin.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: CentralInfraCore/cic-primitive-engine
          ref: ${{ steps.engine.outputs.commit }}
          path: upstream/cic-primitive-engine
      - name: Flat materialization differential, generate, dump with both languages, compare, self-test, the engine as the third reader
        run: |
          set -e
          P="$RUNNER_TEMP/parity-materialize"
          mkdir -p "$P"
          python3 tools/parity/gen_materialize.py "$P/in.jsonl" --count 6000
          (cd rust && PARITY_MATERIALIZE_IN="$P/in.jsonl" PARITY_MATERIALIZE_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_materialize_dump)
          (cd go && PARITY_MATERIALIZE_IN="$P/in.jsonl" PARITY_MATERIALIZE_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpMaterializeOutcomes$' .)
          python3 tools/parity/compare_materialize.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --show 5
          python3 tools/parity/selftest_materialize.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl"
          for l in rust go; do
            cargo +"$RUST_TOOLCHAIN" run --locked -q --manifest-path tools/p5/engine-harness-rust/Cargo.toml -- differential "$P/in.jsonl" "$P/$l.jsonl"
            (cd tools/p5/engine-harness-go && go run . differential "$P/in.jsonl" "$P/$l.jsonl")
          done

  # The edit differential on real defects (P3b E4): a defect planted in one language must turn the comparison red. One job per language (a build and ten
  # dumps each), so that neither takes more than the time budget of a shard.
  edit-proof:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/upstream-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: go/go.sum   # the module is in go/, not at the root (#94)
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
      - name: The unmutated dumps, then the planted defects of one language
        env:
          LANGUAGE: ${{ matrix.lang }}
        run: |
          set -e
          P="$RUNNER_TEMP/edit-proof"
          mkdir -p "$P"
          python3 tools/parity/gen_edit.py "$P/in.jsonl" --count 3000
          (cd rust && PARITY_EDIT_IN="$P/in.jsonl" PARITY_EDIT_OUT="$P/rust.jsonl" cargo +"$RUST_TOOLCHAIN" test --locked --test parity_edit_dump)
          (cd go && PARITY_EDIT_IN="$P/in.jsonl" PARITY_EDIT_OUT="$P/go.jsonl" go test -count=1 -run '^TestDumpEditOutcomes$' .)
          python3 tools/parity/edit_proof.py "$P/in.jsonl" "$P/rust.jsonl" "$P/go.jsonl" --lang "$LANGUAGE"

  # The diff differential on real defects (P4 D3b): a defect planted in one language must turn the Rust/Go/model comparison red (the "diff:" entries of
  # tools/seeded_defects.py). One job per language, as edit-proof.
  diff-proof:
    needs: scope
    if: ${{ needs.scope.outputs.mode != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go]
    steps:
